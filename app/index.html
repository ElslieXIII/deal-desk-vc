  const ACQ = {'Orbitel Ventures': ['Medium', ['Parent group bought a Ugandan mobile-lending start-up (2024)']], 'Crownline Bank Ventures': ['Low', ['Parent bank bought a South African SME-lending platform (2023)']], 'Tidewater Venture Debt': ['Low', []], 'Granite Coast Bank': [null, ['Bought a Ghanaian microfinance licence (2021)']], 'Gridline Africa Developments': [null, ['Bought a Zambian mobile-payments licence holder (2020)']]};
  const team = Object.keys(C.team);
  for (const f of Object.values(C.firms)) {
    const r = rng(f.id), pk = a => a[Math.floor(r() * a.length)];
    const inv = INVESTOR_TYPES.includes(f.type) && f.type !== 'Fund of Funds';
    const reg = regionOf(f.hq);
    if (['Law','Accounting','Advisory','Accelerator'].includes(f.type)) {
      setIf('firms', f, 'sectors', ['Fintech', 'Financial Services']);
      setIf('firms', f, 'verticals', PRACTICE[f.type].filter(() => r() < .75).slice(0, 3));
    }
    if (!f.name.startsWith('Independent operators')) {
      setIf('firms', f, 'geos', reg.startsWith('Africa') ? uniq([reg, 'Sub-Saharan Africa']).filter(g => !(g === 'Sub-Saharan Africa' && reg === 'Africa – North')) : ['Pan-Africa']);
      setIf('firms', f, 'countries', uniq([AFR.includes(f.hq) || CAP[f.hq] ? f.hq : null, pk(AFR), pk(AFR)].filter(Boolean)));
    }
    if (inv) {
      const t = TK[f.type]; if (t) setIf('firms', f, 'tickets', TICKETS.slice(t[0], t[1] + 1));
      setIf('firms', f, 'stages', ST[f.type]);
      setIf('firms', f, 'capital', f.type === 'DFI' ? ['Equity', 'Venture debt'] : f.type === 'Bank' ? ['Venture debt'] : f.type === 'Angel Network' ? ['Equity', 'Convertible'] : ['Equity']);
      setIf('firms', f, 'leadFollow', LF[f.type]);
    }
    if (f.type === 'Fund of Funds') setIf('firms', f, 'tickets', TICKETS.slice(4, 6));
    if (FUND[f.type]) { const [lo, hi] = FUND[f.type]; setIf('firms', f, 'fundSize', Math.round((lo + r() * (hi - lo)) / 5) * 5); }
    if (LP_ADD[f.name]) setIf('firms', f, 'lp', LP_ADD[f.name].map(([fund, amount]) => ({fund, amount})));
    if (ACQ[f.name]) { setIf('firms', f, 'acqAppetite', ACQ[f.name][0]); setIf('firms', f, 'acqHistory', ACQ[f.name][1]); }
    if (empty(f.rms) && r() < .6) setIf('firms', f, 'rms', [pk(team)]);
  }

  /* ---- companies ---- */
  const COMP = [['Rafiki Wallet','Zawadi Wallet'],['Baraka BNPL','Sahl Credit'],['Nyota Insure','Mchanga Insure'],['Wakala Link','Riziki Rails'],['Maji Ledger','Ledgera'],['Gold Coast Ledger','Mosaic Ledger'],['Cedi Cloud','Sokoni Stack'],['Najah Pay','Qantara Pay'],['Oasis Payroll','Mkondo Payroll'],['Kijani Credit','Pamoja Lend'],['Saffron Pay','Atlas Mizan'],['Shamba Sure','Mvua Cover'],['Teranga Remit','Farasi Remit'],['Abyssinia Pay','Kaskazi Pay'],['Medina Trade Finance','Tijara Trade'],['Ubora Credit','Nuru Agri Finance']];
  for (const [a, b] of COMP) { const x = byName('companies', a), y = byName('companies', b); if (x && y) setIf('companies', x, 'competitorOf', [y.id]); }
  for (const c of Object.values(C.companies)) {
    const r = rng(c.id);
    setIf('companies', c, 'city', CAP[c.country] || null);
    setIf('companies', c, 'founded', String(2017 + Math.floor(r() * 6)));
    if (empty(c.size)) setIf('companies', c, 'size', SIZE_BANDS[({'Pre-seed': 0, 'Seed': 1, 'Series A': 2})[c.stage] ?? 2]);
  }

  /* ---- people ---- */
  const BG = {
    'Co-investor': ['Former investment banker, joined venture in 2017','Ex-operator at a pan-African payments company','Previously at a global growth-equity fund','Former founder (exit 2020), now investing','Ex-management consultant covering African financial services','Spent eight years at a DFI before moving to venture','Former head of strategy at a mobile-money operator','Ex-private equity associate, then built the firm’s fintech practice'],
    'LP': ['Runs the fund-investment programme for Africa','Fifteen years in fund investing across emerging markets','Former VC partner, now on the LP side','Previously at a pension fund’s private-markets team','Ex-impact investor covering financial inclusion'],
    'Corporate / strategic': ['Led three acquisitions in the last four years','Former investment banker covering telecoms and payments','Ex-McKinsey, now runs partnerships and M&A','Former fintech founder, joined after an acquisition','Twelve years in the group, previously ran the merchant business'],
    'Adviser': ['Advises on fintech licensing and venture deals','Has worked on most of our term sheets since Fund I','Specialises in financial due diligence for growth-stage companies','Former central-bank lawyer','Led commercial due diligence on 30+ fintech deals'],
  };
  const EXPERT = {
    'Co-investor': f => [arr(f?.verticals)[0], arr(f?.stages)[0] ? arr(f.stages)[0] + ' rounds' : null, arr(f?.geos)[0]],
    'LP': () => ['fund due diligence','impact reporting','emerging-manager programmes'],
    'Corporate / strategic': f => ['M&A','partnerships', arr(f?.verticals)[0]],
    'Adviser': f => ({'Law': ['fintech licensing','shareholder agreements','exchange control'], 'Accounting': ['financial due diligence','tax structuring'], 'Advisory': ['commercial due diligence','market sizing'], 'Accelerator': ['early-stage deal flow','founder coaching']})[f?.type] || ['due diligence'],
    'Founder': (f, t) => /CTO/.test(t) ? ['engineering','payments infrastructure'] : /COO/.test(t) ? ['operations','credit risk'] : /CFO/.test(t) ? ['finance','debt raising'] : ['fundraising', arr(f?.verticals)[0]],
  };
  for (const p of Object.values(C.people)) {
    const r = rng(p.id), pk = a => a[Math.floor(r() * a.length)];
    const org = p.orgType === 'company' ? C.companies[p.orgId] : C.firms[p.orgId];
    if (r() < .9) setIf('people', p, 'phone', '+000 ' + (10 + Math.floor(r() * 90)) + ' ' + (100 + Math.floor(r() * 900)) + ' ' + (1000 + Math.floor(r() * 9000)));
    if (BG[p.category] && r() < .85) setIf('people', p, 'background', pk(BG[p.category]));
    if (EXPERT[p.category] && r() < .75) setIf('people', p, 'expertise', uniq(EXPERT[p.category](org, p.title || '').filter(Boolean)).map(x => x.charAt(0) === x.charAt(0).toUpperCase() && !/^(M&A|Series|Africa|Sub|Pan|Middle)/.test(x) ? x.toLowerCase() : x));
  }
  return changes;
}

/* ============================================================
   App shell: boot, header, tabs, routing, events, Settings, Undo
   ============================================================ */
const TABS = [
  {id:'summary', label:'Summary'},
  {id:'catchup', label:'Catch-up'},
  {id:'relationships', label:'Relationship management'},
  {id:'sourcing', label:'Sourcing'},
  {id:'opportunities', label:'Pipeline', hash:'pipeline'},
  {id:'pipeline', label:'Live deals', hash:'live-deals'},
  {id:'portfolio', label:'Portfolio'},
  {id:'crm', label:'CRM'},
  {id:'conversations', label:'Recent conversations'},
  {id:'news', label:'News'},
];
const VIEWS = {};
const hashOf = id => (TABS.find(t => t.id === id) || {}).hash || id;
const tabOfHash = h => (TABS.find(t => '#' + (t.hash || t.id) === h) || {}).id;
const R = { tab: tabOfHash(location.hash) || storeGet('tab', 'summary'), rec: null, back: [] };
const FS = storeGet('filters', {});
const fget = (tab, key, def) => (FS[tab] && FS[tab][key] !== undefined) ? FS[tab][key] : def;
function fset(tab, key, val, noRender){ FS[tab] = FS[tab] || {}; FS[tab][key] = val; storeSet('filters', FS); if (!noRender) renderAll(); }
function freset(tab, keep){ const k = {}; (keep || []).forEach(x => { if (FS[tab] && x in FS[tab]) k[x] = FS[tab][x]; }); FS[tab] = k; storeSet('filters', FS); renderAll(); }
/* Multi-select filter bound to FS */
function fMs(tab, key, label, options, single){
  return msButton(tab + '-' + key, {label, options: typeof options === 'function' ? options : () => options, get: () => fget(tab, key, single ? '' : []), set: v => fset(tab, key, v, true), onChange: () => renderAll(), single});
}
const fIn = (tab, key, v) => { const sel = arr(fget(tab, key, [])); return !sel.length || arr(v).some(x => sel.includes(x)); };
function searchBox(tab, ph){ return `<label class="search"><span aria-hidden="true">⌕</span><input id="q-${tab}" data-q="${tab}" type="search" placeholder="${esc(ph || 'Search…')}" value="${esc(fget(tab, 'q', ''))}"></label>`; }

function go(tab, opts = {}){
  closePop();
  if (opts.filters) { FS[tab] = Object.assign(FS[tab] || {}, opts.filters); storeSet('filters', FS); }
  R.tab = tab; R.rec = null; R.back = []; storeSet('tab', tab);
  if (location.hash !== '#' + hashOf(tab)) history.replaceState(null, '', '#' + hashOf(tab));
  renderAll(); window.scrollTo(0, 0);
}
function openRecord(kind, id){
  closePop();
  if (kind === 'tab') return go(id);
  if (kind === 'dist') { const r = rec('dist', id); if (r) { fset('distribution', 'deal', r.dealId, true); go('distribution'); } return; }
  if (kind === 'opp') { const o = rec('opps', id); if (!o) return; if (o.kind !== 'idea') { if (o.companyId) kind = 'company', id = o.companyId; else return go('opportunities'); } else kind = 'idea'; }
  if (R.rec) R.back.push(R.rec);
  R.rec = {kind, id}; renderAll(); window.scrollTo(0, 0);
}
function goBack(){ R.rec = R.back.pop() || null; renderAll(); }
const link = (kind, id, text, cls = 'rowlink') => id ? `<a href="#" class="${cls}" data-open="${kind}:${id}">${esc(text || nameOf(kind, id) || 'Unknown')}</a>` : esc(text || '');

/* ---------------- counts for tab badges ---------------- */
function tabCounts(){
  const items = catchupItems(); const open = items.filter(i => i.state === 'open');
  const mine = open.filter(i => arr(i.owners).includes(me()));
  const t = today(), m0 = t.slice(0, 7);
  return {
    summary: {n: mine.length},
    catchup: {n: open.length, red: open.some(i => isOverdue(i.due))},
    relationships: {n: all('tasks').filter(x => x.kind === 'reminder' && !x.done && x.due && x.due.slice(0, 7) === m0).length},
    sourcing: {n: all('cands').filter(c => !c.hidden && c.status === 'new').length},
    opportunities: {n: all('opps').filter(o => OPP_OPEN.includes(o.status)).length},
    portfolio: {n: all('ports').filter(p => p.status === 'Active').length, red: all('ports').some(p => p.status === 'Active' && p.health === 'Red')},
    pipeline: {n: all('deals').filter(dealActive).length},
    crm: {n: all('firms').length + all('companies').length},
    conversations: {n: visibleNotes().filter(n => n.date >= addDays(t, -30)).length},
    news: {n: all('news').filter(n => !n.dismissed && n.date >= addDays(t, -7)).length},
  };
}
const visibleNotes = () => all('notes').filter(n => !n.private || n.author === me());

/* ---------------- render ---------------- */
function renderAll(){
  const root = $('#app'); if (!root) return;
  const ae = document.activeElement; const fid = ae && ae.id && root.contains(ae) ? ae.id : null;
  const selS = fid && 'selectionStart' in ae ? ae.selectionStart : null;
  const sy = window.scrollY;
  root.innerHTML = renderShell();
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); try { if (selS != null) el.setSelectionRange(selS, selS); } catch {} } }
  window.scrollTo(0, sy);
  updateUndoUi();
}
function renderShell(){
  if (!ST.ready) return mastHtml() + `<main><div class="loading">${ST.loadErr ? esc(ST.loadErr) : '<span class="spinner"></span>&nbsp; Loading the desk…'}</div></main>`;
  const empty = !all('team').length;
  if (empty) return mastHtml() + `<main>${emptyHtml()}</main>`;
  if (!rec('team', VIEW_AS)) { VIEW_AS = team()[0].id; storeSet('viewas', VIEW_AS); }
  const counts = tabCounts();
  const tabs = TABS.map(t => { const c = counts[t.id] || {}; return `<button class="tab ${R.tab === t.id && !R.rec ? 'on' : ''}" data-tab="${t.id}">${esc(t.label)} <span class="badge ${c.red ? 'red' : ''}">${c.n ?? ''}</span></button>`; }).join('');
  let body = '';
  try { body = R.rec ? renderRecord(R.rec) : VIEWS[R.tab](); }
  catch (e) { console.error(e); body = `<div class="banner">Something went wrong drawing this view (${esc(e.message)}). <button class="btn sm" data-tab="${R.tab}">Reload view</button></div>`; }
  return mastHtml() + `<nav class="tabrail" aria-label="Desk sections">${tabs}<span class="today">${esc(new Date().toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short', year:'numeric'}))}</span></nav><main>${body}</main>`;
}
function mastHtml(){
  const opts = team().map(t => `<option value="${t.id}" ${t.id === VIEW_AS ? 'selected' : ''}>${esc(t.name)}</option>`).join('');
  const pend = all('proposals').filter(p => p.owner === me() && p.state === 'pending').length;
  return `<header class="mast">
    <div class="brand"><h1>Deal Desk</h1><span class="sub">Investments · ${esc(BANK)}</span>
    <span class="demo-chip" title="Made-up data for demonstrations. Not a real pipeline.">Demo – sample data</span></div>
    <div class="mast-right">
      ${all('team').length ? `<label class="viewas" for="viewas">Viewing as <select id="viewas">${opts}</select></label>
      <button class="btn agent" data-act="emailScan" title="Review what the email scan found for you">✉ Email scan${pend ? ` <span class="badge" style="background:var(--agent);color:#fff">${pend}</span>` : ''}</button>
      <span class="seg" role="group" aria-label="Undo and redo"><button id="undoBtn" data-act="undo" title="Undo">↶ Undo</button><button id="redoBtn" data-act="redo" title="Redo">↷</button></span>
      <button class="btn iconbtn" data-act="settings" title="Settings" aria-label="Settings">⚙</button>` : ''}
    </div></header>`;
}
function emptyHtml(){
  const can = ST.isOwner || ST.canEdit;
  return `<div class="card" style="max-width:640px;margin:40px auto;padding:22px"><h2 style="font-size:26px;text-transform:uppercase">The demo desk is empty</h2>
  <p>This desk runs on made-up sample data: about 60 institutions, 40 companies, 150 contacts, 14 deals and their notes, tasks, distribution lists and news. The dates are set relative to the day you load it, so it always looks current.</p>
  ${can ? `<p><button class="btn primary" data-act="seed">Load sample data</button></p>` : `<p class="muted">Ask the owner of this desk to load the sample data.</p>`}</div>`;
}
function updateUndoUi(){
  const u = $('#undoBtn'), r = $('#redoBtn'); if (!u) return;
  const uc = undoCandidate(), rc = redoCandidate();
  u.disabled = !uc; r.disabled = !rc;
  u.title = uc ? `Undo: ${uc.label} (${ago(uc.ts)}) — Ctrl/Cmd+Z` : 'Nothing to undo from the last 24 hours';
  r.title = rc ? `Redo: ${rc.label} — Ctrl/Cmd+Shift+Z` : 'Nothing to redo';
}

/* ---------------- events ---------------- */
const ACTIONS = {};
document.addEventListener('click', e => {
  const t = e.target;
  const a = t.closest('[data-open]'); if (a) { e.preventDefault(); const [k, id] = a.dataset.open.split(':'); openRecord(k, id); return; }
  const tb = t.closest('[data-tab]'); if (tb) { e.preventDefault(); go(tb.dataset.tab); return; }
  const s = t.closest('[data-sort]'); if (s) { toggleSort(s.dataset.sort); return; }
  const ms = t.closest('[data-ms]'); if (ms) { e.preventDefault(); if (POP && POP.anchor === ms) closePop(); else openMs(ms); return; }
  const ow = t.closest('[data-own]'); if (ow) { e.preventDefault(); openOwnerMenu(ow); return; }
  const ep = t.closest('[data-eip]'); if (ep) { startEip(ep); return; }
  const dt = t.closest('[data-date]'); if (dt) { e.preventDefault(); if (POP && POP.anchor === dt) closePop(); else openDatePop(dt); return; }
  const h = t.closest('[data-help]'); if (h) { showHelp(h.dataset.help); return; }
  const env = t.closest('[data-copy]'); if (env) { copyText(env.dataset.copy); return; }
  const ac = t.closest('[data-act]'); if (ac && !ac.disabled) { e.preventDefault(); const fn = ACTIONS[ac.dataset.act]; if (fn) fn(ac.dataset.arg, ac, e); else console.warn('no action', ac.dataset.act); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.eip')) { e.preventDefault(); startEip(e.target); }
  if (e.key === 'Escape') { if (POP) closePop(); else if (MODALS.length) closeModal(); }
  const inField = e.target.closest('input,textarea,select,[contenteditable="true"]');
  if ((e.ctrlKey || e.metaKey) && !inField && !MODALS.length && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redoAction() : undoAction(); }
  if ((e.ctrlKey || e.metaKey) && !inField && !MODALS.length && e.key.toLowerCase() === 'y') { e.preventDefault(); redoAction(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'viewas') { VIEW_AS = t.value; storeSet('viewas', VIEW_AS); toast('Now viewing as ' + tName(VIEW_AS)); renderAll(); return; }
  if (t.dataset.inl) { onInline(t); return; }
  if (t.dataset.f) { const [tab, key] = t.dataset.f.split('|'); fset(tab, key, t.type === 'checkbox' ? t.checked : t.value); return; }
  if (t.dataset.chg && ACTIONS[t.dataset.chg]) ACTIONS[t.dataset.chg](t.value, t);
});
let qTimer = null;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.q) { clearTimeout(qTimer); const tab = t.dataset.q; const v = t.value; qTimer = setTimeout(() => fset(tab, 'q', v), 160); }
});
document.addEventListener('focusin', e => { if (e.target.matches('select.inl')) UI.editing = true; });
document.addEventListener('focusout', e => { if (e.target.matches('select.inl')) setTimeout(flushBlocked, 0); });
window.addEventListener('hashchange', () => { const t = tabOfHash(location.hash); if (t && (t !== R.tab || R.rec)) go(t); });

async function copyText(s){ try { await navigator.clipboard.writeText(s); toast('Copied ' + s); } catch { toast('Copy not available here: ' + s); } }

const FIELD_LABEL = {conviction:'conviction', alloc:'allocation', health:'health', nextBoard:'next board date', icDate:'IC date', icDecision:'IC decision', lastContacted:'last contacted', stage:'stage', priority:'priority', status:'status', relevance:'relevance', importance:'importance', category:'category', due:'due date', nextDue:'due date', ranking:'ranking', strength:'relationship strength', dataRoom:'data room access', type:'type', mandate:'mandate'};
function onInline(el){ applyInline(el.dataset.inl, el.value, el); }
function applyInline(ref, v, el){
  const [coll, id, field] = ref.split('|');
  UI.editing = false;
  if (coll === 'cu') { cuSet(id, field, v); return; }
  const r = rec(coll, id); if (!r) return;
  if (field === 'priority') v = +v;
  if (v === '') v = null;
  if (['conviction', 'alloc', 'cheque', 'preMoney', 'size'].includes(field) && v != null) v = +v;
  if (coll === 'opps' && field === 'status' && v === 'Moved to DD') { if (el) el.value = r.status; promoteOpp(id); return; }
  if (coll === 'opps' && field === 'status' && v === 'Passed') { if (el) el.value = r.status; passOpp(id); return; }
  if (coll === 'deals' && field === 'stage' && ['Invested', 'Lost', 'Passed'].includes(v) && v !== r.stage) { if (el) el.value = r.stage; closeDeal(id, v); return; }
  const patch = {[field]: v};
  setFields(coll, id, patch, `Changed ${FIELD_LABEL[field] || field} on ${recLabel(coll, r)}${v != null ? ' to ' + (field === 'priority' ? v + ' ' + PRIORITY[v] : field.toLowerCase().includes('due') ? fmtDate(v) : v) : ''}`);
}

  if (['rms','owners','ours'].includes(k)) return esc(arr(v).map(tName).join(', '));

  if (Array.isArray(v)) return esc(v.join(', '));
  if (typeof v === 'object') return '<span class="faint">(details)</span>';
  return esc(String(v).slice(0, 160));

/* ---------------- boot ---------------- */
async function boot(){
  renderAll();
  const timer = setTimeout(() => { if (!ST.ready) { ST.loadErr = 'The desk’s data can’t be reached yet. It will appear as soon as the connection answers.'; renderAll(); } }, 10000);
  let db = null;
  try { db = await __demoClaude.use('db'); } catch {}
  if (!db) { clearTimeout(timer); ST.loadErr = 'Sign in to claude.ai to use this desk.'; renderAll(); return; }
  ST.db = db;
  try { ST.user = await __demoClaude.use('user'); } catch {}
  if (ST.user) { try { ST.isOwner = !!ST.user.isOwner(); ST.canEdit = !!ST.user.canEdit(); const cw = ST.user.can && ST.user.can('data.write'); if (cw === false) ST.canWrite = false; } catch {} }
  __demoClaude.use('sample').then(s => { ST.sample = s; }).catch(() => {});
  __demoClaude.use('downloads').then(d => { ST.downloads = d; }).catch(() => {});
  db.collection('desk').onSnapshot(snap => {
    ingestShards(snap.docs);
    if (!snap.metadata.fromCache) { clearTimeout(timer); ST.loadErr = null; }
    ST.ready = true; scheduleRender();
    if (!snap.metadata.fromCache) fillBlankCrmOnce();
  }, err => { clearTimeout(timer); ST.ready = false; ST.loadErr = 'The desk’s data could not be loaded (' + (err && err.code) + ').'; renderAll(); });
  db.collection('changes').orderBy('ts', 'desc').limit(600).onSnapshot(snap => {
    const local = CHANGES.filter(c => !snap.docs.some(d => d.id === c.id) && Date.now() - c.ts < 15000);
    CHANGES.length = 0; CHANGES.push(...local, ...snap.docs.map(d => Object.assign({id: d.id}, clone(d.data()))));
    CHANGES.sort((a, b) => b.ts - a.ts); ST.changesLoaded = true; updateUndoUi();
  }, () => {});
}

/* One-time tidy-up for desks loaded before the CRM fill existed: fills blank CRM fields on
   existing records only (never overwrites a value), as one change that Undo can reverse. */
async function fillBlankCrmOnce(){
  if (ST.crmFillTried || !ST.canWrite || !(ST.isOwner || ST.canEdit)) return;
  const meta = D.meta && D.meta.settings;
  if (!meta || !meta.seededAt || meta.crmFilled || meta.bank !== BANK) return;
  ST.crmFillTried = true;
  const C = {}; ['people', 'firms', 'companies', 'team'].forEach(c => C[c] = clone(D[c] || {}));
  const changed = enrichCRM(C);
  const ids = uniq(changed.map(x => x.coll + ':' + x.id));
  const writes = ids.map(k => { const [coll, id] = k.split(':'); return {coll, id, rec: C[coll][id]}; });
  // the marker is saved on its own, outside the undoable change, so Undo removes the values and they stay removed
  const mark = [{coll: 'meta', id: 'settings', before: clone(meta), after: Object.assign(clone(meta), {crmFilled: true, id: 'settings'})}];
  try { applyLocal(mark); await persist(mark); } catch (e) { handleWriteError(e); return; }
  if (!writes.length) return;
  await act(`Filled in ${changed.length} blank CRM fields`, writes, {source: 'system', toast: `Filled in ${changed.length} blank CRM fields on existing records`});
}

/* Load / reset the sample data (owner or editor, on an explicit click) */
async function seedDemo(){
  if (!ST.db) return;
  const box = openModal({title: 'Loading sample data', size: 'narrow', body: `<p><span class="spinner"></span> <span id="seedMsg">Preparing…</span></p>`});
  const msg = t => { const m = $('#seedMsg'); if (m) m.textContent = t; };
  try {
    const {colls, changes} = buildSeed(today());
    msg('Clearing the old change history…');
    const old = await ST.db.collection('changes').get();
    for (const d of old.docs) await ST.db.doc('changes/' + d.id).delete();
    msg('Writing records…');
    const shards = {};
    for (const c of COLLS) for (let k = 0; k < SHARDS[c]; k++) shards[c + '-' + k] = {};
    for (const c of COLLS) for (const [id, r] of Object.entries(colls[c])) shards[shardOf(c, id)][id] = stripId(r);
    let n = 0; const keys = Object.keys(shards);
    for (const k of keys) { await ST.db.doc('desk/' + k).set({r: shards[k]}); ST.shardDocs.add(k); n++; msg(`Writing records… ${n} of ${keys.length}`); }
    msg('Writing change history…');
    for (const c of changes) { const {id, ...body} = c; await ST.db.doc('changes/' + id).set(body); }
    CHANGES.length = 0; changes.forEach(c => CHANGES.push(clone(c)));
    if (!rec('team', VIEW_AS)) { VIEW_AS = 'u-demo'; storeSet('viewas', VIEW_AS); }
    VIEW_AS = 'u-demo'; storeSet('viewas', VIEW_AS);
    closeModal(box); toast('Sample data loaded'); go('summary');
  } catch (e) { console.error(e); closeModal(box); toast('Could not load the sample data (' + (e && (e.code || e.message)) + ').', true); }
}

function catchupItems(){
  const t = today(), out = [];
  const cu = k => D.catchup[k] || {};
  const stateOf = (done, snooze, cleared) => cleared ? 'cleared' : done ? 'done' : (snooze && snooze > t) ? 'snoozed' : 'open';
  for (const x of all('tasks')) {
    if (x.kind === 'reminder' && !x.done && x.due && mondayOf(x.due) > t) continue;
    out.push({key: 'task-' + x.id, taskId: x.id, kind: x.kind, title: x.title, link: x.link, source: x.source === 'Email scan' ? 'Email scan' : x.kind === 'reminder' ? 'Reminder' : x.source === 'CRM' ? 'CRM' : x.source === 'News' ? 'News' : 'Task',
      category: x.category || 'Business development', importance: x.importance || 'Medium', owners: arr(x.owners), ownerRef: ['tasks', x.id, 'owners'], due: x.due, dueRef: ['tasks', x.id, 'due'], created: x.created, doneAt: x.doneAt, snoozeUntil: x.snoozeUntil, state: stateOf(x.done, x.snoozeUntil, x.cleared)});
  }
  for (const d of all('deals')) {

    const cells = [];
    for (let k = 0; k < 42; k++) { const d = new Date(start); d.setDate(start.getDate() + k); cells.push(isoOf(d)); }

  } else {
    const rows = items.filter(i => i.due >= addDays(t, -31)).sort((a, b) => a.due.localeCompare(b.due));
    body = table({id: 'rmlist', rows, defSort: {key: 'due', dir: 'asc'}, rowCls: i => isOverdue(i.due) && i.state !== 'done' ? 'overdue' : '', cols: [
      {key:'due', label:'Date', sort: i => i.due, render: i => `<span class="mono due">${fmtDate(i.due)}</span>`, cls: 'nowrap'},
      {key:'title', label:'Item', sort: i => i.title, render: i => `<div style="font-weight:600;${i.state === 'done' ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(i.title)}</div><div>${itemLinkHtml(i)}</div>`},
      {key:'kind', label:'Type', sort: i => i.kind, render: i => `<span class="src">${i.kind === 'reminder' ? 'Reminder' : 'Task'}</span>`},
      {key:'owners', label:'Owners', sort: i => i.owners.map(tName).join(), render: ownerCell},
      {key:'act', label:'', render: i => `<div style="display:flex;gap:4px;justify-content:flex-end">${i.link && i.link.kind !== 'tab' ? `<button class="btn sm agent" data-act="prep" data-arg="${i.key}">✦ Meeting prep</button>` : ''}<button class="btn sm" data-act="cuOpen" data-arg="${i.key}">Open</button>${i.state === 'done' ? `<button class="btn sm" data-act="rmReopen" data-arg="${i.key}">Reopen</button>` : `<button class="btn sm" data-act="rmDone" data-arg="${i.key}">Done</button>`}</div>`},
    ], empty: 'No reminders in this period.'});

  // Potential discussions

  const pd = all('people').filter(p => arr(p.rms).includes(pw) && (!p.lastContact || p.lastContact < cutoff)).sort((a, b) => (a.lastContact || '0').localeCompare(b.lastContact || '0'));
  const pdHtml = `<section class="card" style="margin-top:14px"><div class="ch"><h3>Potential discussions</h3><span class="badge">${pd.length}</span><span style="flex:1"></span><label class="viewas">Contacts looked after by <select data-f="relationships|pdWho" aria-label="Team member">${team().map(tm => `<option value="${tm.id}" ${tm.id === pw ? 'selected' : ''}>${esc(tm.name)}</option>`).join('')}</select></label></div>
    <div class="cb"><p class="muted" style="margin:6px 0">People ${esc(tName(pw))} looks after who haven’t been spoken to in over a month. Tick several to book catch-ups in one go.</p>
    ${pd.length ? `<div class="tw" style="max-height:340px;overflow:auto"><table class="t"><thead><tr><th class="plain" style="width:28px"><input type="checkbox" id="pd-all" aria-label="Select all"></th><th class="plain">Contact</th><th class="plain">Organisation</th><th class="plain">Strength</th><th class="plain">Last contacted</th><th class="plain">Booked</th></tr></thead><tbody>${pd.map(p => `<tr><td><input type="checkbox" class="pd-sel" value="${p.id}" aria-label="Select ${esc(p.name)}"></td><td>${link('person', p.id, p.name)}<div class="sub2">${esc(p.title || '')}</div></td><td>${link(p.orgType === 'company' ? 'company' : 'firm', p.orgId, orgName(p), 'sub2')}</td><td>${strengthPill(p.strength)}</td><td class="mono">${p.lastContact ? fmtDate(p.lastContact) + ` <span class="faint">(${daysBetween(p.lastContact, t)}d)</span>` : '<span class="faint">Never</span>'}</td><td>${booked.has(p.id) ? '<span class="pill g">Booked</span>' : ''}</td></tr>`).join('')}</tbody></table></div>
    <div style="display:flex;gap:8px;align-items:center;margin:10px 0;flex-wrap:wrap"><label class="viewas" for="pd-date">Book for</label><input type="date" id="pd-date" value="${addDays(t, 7)}" style="padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)"><button class="btn primary" data-act="pdBook" data-arg="${pw}">Book reminders for ticked contacts</button></div>` : '<div class="empty">Everyone has been contacted in the last month.</div>'}</div></section>`;
  return viewHead('relationships', `<button class="btn" data-act="lapsed" title="Scan the CRM for contacts a team member hasn't spoken to in a while">⌕ Find who to catch up with</button><button class="btn primary" data-act="addReminder">+ Add reminder</button>`) +
    `<div class="fbar">${whoSelect('relationships', 'who', me(), {unassigned: true})}<span class="seg"><button class="${mode === 'cal' ? 'on' : ''}" data-act="fv" data-arg="relationships|mode|cal">Calendar</button><button class="${mode === 'list' ? 'on' : ''}" data-act="fv" data-arg="relationships|mode|list">List</button></span><span class="fcount">${items.filter(i => i.state !== 'done').length} open with dates</span></div>` + body + pdHtml;
};
function rmItems(){
  const t = today();
  const fromCu = catchupItems().filter(i => i.due && (i.state === 'open' || i.state === 'done' || i.state === 'snoozed'));
  const future = all('tasks').filter(x => x.kind === 'reminder' && !x.done && x.due && mondayOf(x.due) > t).map(x => ({key: 'task-' + x.id, taskId: x.id, kind: 'reminder', title: x.title, link: x.link, due: x.due, owners: arr(x.owners), ownerRef: ['tasks', x.id, 'owners'], importance: x.importance, state: 'open'}));

ACTIONS.rmMonth = d => { const cur = fget('relationships', 'month', today().slice(0, 7)); if (+d === 0) return fset('relationships', 'month', today().slice(0, 7)); const [y, m] = cur.split('-').map(Number); const x = new Date(y, m - 1 + (+d), 1); fset('relationships', 'month', x.getFullYear() + '-' + pad(x.getMonth() + 1)); };

/* Scan the CRM for people or institutions a team member hasn't spoken to in a while */
const LAPSE = [['1','Over a month',30],['3','Over 3 months',91],['6','Over 6 months',182],['12','Over a year',365]];
function lastSpoken(){
  const m = {};
  const bump = (k, d) => { if (d && (!m[k] || m[k] < d)) m[k] = d; };
  for (const p of all('people')) bump('person:' + p.id, p.lastContact);
  for (const n of all('notes')) { if (n.type === 'Other') continue; for (const l of arr(n.links)) bump(l.kind + ':' + l.id, n.date); }
  for (const p of all('people')) bump((p.orgType === 'company' ? 'company:' : 'firm:') + p.orgId, m['person:' + p.id]);
  return m;
}
ACTIONS.lapsed = () => {
  const w = fget('relationships', 'who', me());
  const st = {who: ['all', 'none'].includes(w) ? me() : w, period: storeGet('lapse:period', '3'), scope: storeGet('lapse:scope', 'people'), never: storeGet('lapse:never', true), sel: new Set(), q: ''};
  openModal({title: 'Find who to catch up with', size: 'wide', body: `<div id="lp"></div>`,
    foot: `<span class="left" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><label class="viewas" for="lp-date">First reminder on</label><input type="date" id="lp-date" value="${addDays(today(), 3)}" style="padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)"><label class="switch" style="font-size:12px"><input type="checkbox" id="lp-spread" checked> Spread over weekdays (3 a day)</label><select id="lp-imp" aria-label="Importance" style="padding:4px 6px;border:1px solid var(--line-2);border-radius:6px;background:var(--surface)">${LEVELS.map(l => `<option ${l === 'Medium' ? 'selected' : ''}>${l}</option>`).join('')}</select></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="lp-go">Create reminders</button>`,
    onMount: el => {
      const draw = () => {
        const t = today(), days = LAPSE.find(x => x[0] === st.period)[2], cutoff = addDays(t, -days);
        const ls = lastSpoken();
        const booked = new Set(all('tasks').filter(x => x.kind === 'reminder' && !x.done && x.link).map(x => x.link.kind + ':' + x.link.id));
        const pool = st.scope === 'people'
          ? all('people').filter(p => arr(p.rms).includes(st.who)).map(p => ({key: 'person:' + p.id, kind: 'person', id: p.id, name: p.name, sub: (p.title ? p.title + ' · ' : '') + orgName(p), strength: p.strength}))
          : [...all('firms').map(f => ({key: 'firm:' + f.id, kind: 'firm', id: f.id, name: f.name, sub: f.type + ' · ' + f.hq, rms: f.rms})), ...all('companies').map(c => ({key: 'company:' + c.id, kind: 'company', id: c.id, name: c.name, sub: 'Company · ' + c.country, rms: c.rms}))].filter(o => arr(o.rms).includes(st.who));
        const ws = words(st.q);
        const rows = pool.map(o => Object.assign(o, {last: ls[o.key] || null, booked: booked.has(o.key)}))
          .filter(o => o.last ? o.last < cutoff : st.never)
          .filter(o => !ws.length || ws.every(x => (o.name + ' ' + o.sub).toLowerCase().includes(x)))
          .sort((a, b) => (a.last || '0').localeCompare(b.last || '0') || a.name.localeCompare(b.name));
        for (const k of [...st.sel]) if (!rows.some(r => r.key === k)) st.sel.delete(k);
        const since = d => { if (!d) return '<span class="faint">Never</span>'; const n = daysBetween(d, t); return `<span class="mono">${fmtDate(d)}</span> <span class="faint">(${n >= 365 ? Math.floor(n / 365) + 'y ' : ''}${n >= 60 ? Math.floor((n % 365) / 30.4) + 'm' : n + 'd'} ago)</span>`; };
        $('#lp', el).innerHTML = `<div class="fbar">
          <label class="viewas">Team member <select id="lp-who">${team().map(tm => `<option value="${tm.id}" ${tm.id === st.who ? 'selected' : ''}>${esc(tm.name)}${tm.id === me() ? ' (me)' : ''}</option>`).join('')}</select></label>
          <span class="seg" role="group" aria-label="Not spoken to in">${LAPSE.map(([k, l]) => `<button type="button" class="${st.period === k ? 'on' : ''}" data-lp-period="${k}">${l}</button>`).join('')}</span>
          <span class="seg" role="group" aria-label="Scan"><button type="button" class="${st.scope === 'people' ? 'on' : ''}" data-lp-scope="people">People</button><button type="button" class="${st.scope === 'orgs' ? 'on' : ''}" data-lp-scope="orgs">Institutions & companies</button></span>

ACTIONS.prep = key => { const i = rmItems().find(x => x.key === key) || catchupItems().find(x => x.key === key); if (i) meetingPrep(i); };
function prepContext(item){
  const L = item.link || {}; const orgs = []; let people = []; const deals = []; let focus = '', idea = null;
  const addOrg = (kind, id) => { if (id && rec(kind === 'company' ? 'companies' : 'firms', id) && !orgs.some(o => o.id === id)) orgs.push({kind, id}); };
  const orgOfP = p => p && addOrg(p.orgType === 'company' ? 'company' : 'firm', p.orgId);
  if (L.kind === 'person') { const p = rec('people', L.id); if (p) { people = [p.id]; orgOfP(p); focus = p.name + (p.title ? ', ' + p.title : '') + ' at ' + orgName(p); } }
  else if (L.kind === 'firm' || L.kind === 'company') { addOrg(L.kind, L.id); people = peopleAt(L.kind, L.id).map(p => p.id); focus = nameOf(L.kind, L.id); }
  else if (L.kind === 'deal') { const d = rec('deals', L.id); if (d) { deals.push(d.id); addOrg('company', d.clientId); people = uniq([...arr(d.contacts), ...peopleAt('company', d.clientId).map(p => p.id)]); focus = dealName(d) + ' (' + (rec('companies', d.clientId)?.name || '') + ')'; } }
  else if (L.kind === 'dist') { const r = rec('dist', L.id); if (r) { deals.push(r.dealId); addOrg('firm', r.firmId); people = [r.contactId, ...arr(r.extra)].filter(Boolean); focus = (rec('firms', r.firmId)?.name || '') + ' on ' + dealName(rec('deals', r.dealId)); } }
  else if (L.kind === 'opp' || L.kind === 'idea') { const o = rec('opps', L.id); if (o) { if (o.kind === 'idea') { idea = o; arr(o.targets).forEach(c => addOrg('company', c)); arr(o.investors).forEach(f => addOrg('firm', f)); focus = 'Idea: ' + o.title; } else { addOrg('company', o.companyId); addOrg('firm', o.sponsorId); people = peopleAt('company', o.companyId).map(p => p.id); if (o.dealId) deals.push(o.dealId); focus = oppName(o); } } }
  const orgIds = new Set(orgs.map(o => o.id)), pIds = new Set(people);
  all('deals').forEach(d => { if (orgIds.has(d.clientId) && !deals.includes(d.id)) deals.push(d.id); });
  const touches = n => n.dealId && deals.includes(n.dealId) || arr(n.links).some(l => l.kind === 'person' ? pIds.has(l.id) || orgIds.has(rec('people', l.id)?.orgId) : orgIds.has(l.id));
  const notes = visibleNotes().filter(touches).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 18);
  const emails = all('proposals').filter(q => (q.owner === me() || q.state === 'approved') && ((q.fromId && (pIds.has(q.fromId) || orgIds.has(rec('people', q.fromId)?.orgId))) || orgIds.has(q.payload?.firmId) || orgIds.has(q.payload?.companyId) || orgIds.has(q.payload?.orgId) || deals.includes(q.payload?.dealId))).slice(0, 8);
  const dist = all('dist').filter(r => orgIds.has(r.firmId) || deals.includes(r.dealId) && (orgIds.has(r.firmId) || L.kind === 'deal'));
  const opps = all('opps').filter(o => orgIds.has(o.companyId) || orgIds.has(o.sponsorId) || (idea && o.id === idea.id));
  const tasks = all('tasks').filter(t => !t.done && t.link && (t.link.kind === 'person' ? pIds.has(t.link.id) : t.link.kind === 'deal' ? deals.includes(t.link.id) : orgIds.has(t.link.id)));
  const news = all('news').filter(n => (n.saved || n.date >= addDays(today(), -60)) && (arr(n.firms).some(f => orgIds.has(f)) || arr(n.companies).some(c => orgIds.has(c)))).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 8);
  const holdings = all('holdings').filter(h => orgIds.has(h.firmId) || orgIds.has(h.companyId));
  return {item, focus, orgs, people, deals, notes, emails, dist, opps, tasks, news, holdings, idea};
}

    pipeline: c.opps.map(o => ({company: oppName(o), source: o.signal, round: o.round, raising: money(o.raise), status: o.status, conviction: o.conviction, notes: o.details, next_steps: o.nextStep, pass_reason: o.passReason || null})),
    open_tasks: c.tasks.slice(0, 10).map(t => ({task: t.title, due: t.due, owners: arr(t.owners).map(tName)})),
    news: c.news.map(n => ({date: n.date, source: n.source, headline: n.title, summary: n.summary, mentions: [...arr(n.firms).map(f => rec('firms', f)?.name), ...arr(n.companies).map(x => rec('companies', x)?.name)].filter(Boolean), why_it_matters: n.why})),
  };
}
async function meetingPrep(item){

/* ============================================================

const relPill = r => `<span class="pill ${r === 'High' ? 'g' : r === 'Medium' ? 'a' : ''}">${esc(r || '—')}</span>`;
const srcTag = s => s === 'Sourcing' ? '<span class="agent-tag">Sourcing engine</span>' : s === 'Agent' ? '<span class="agent-tag">Agent</span>' : s === 'Email scan' ? '<span class="src scan">Email scan</span>' : `<span class="src">${esc(s || 'Team')}</span>`;
const RANGE_DAYS = {'30':30, '90':90, '180':180, '365':365};

/* Latest real contact with anyone at a company: notes, emails picked up by the scan, last-contacted dates */
let COMMS = null;
function commsIndex(){
  const idx = {};
  const bump = (cid, date, how) => { if (!cid || !date) return; if (!idx[cid] || idx[cid].date < date) idx[cid] = {date, how}; };
  const coOfPerson = id => { const p = rec('people', id); return p && p.orgType === 'company' ? p.orgId : null; };
  for (const n of visibleNotes()) {
    if (n.type === 'Other') continue;
    const np = noteParties(n.links); const who = np.people.map(id => nameOf('person', id)).join(', ');
    const cids = uniq([np.org && np.org.kind === 'company' ? np.org.id : null, ...np.people.map(coOfPerson)]);
    cids.forEach(cid => bump(cid, n.date, `${n.type} note${who ? ' with ' + who : ''} by ${tName(n.author)} (${fmtDate(n.date)}): ${plain(n.html).slice(0, 120)}`));
  }
  for (const q of all('proposals')) if (q.state === 'approved') { const fp = rec('people', q.fromId); if (fp && fp.orgType === 'company') bump(fp.orgId, q.date, `Email from ${fp.name}, picked up by the email scan (${fmtDate(q.date)}): ${q.subject}`); }
  // Last-contacted dates only win when nothing more specific is logged for that day
  for (const p of all('people')) if (p.orgType === 'company' && p.lastContact) bump(p.orgId, p.lastContact, `Last contacted: ${p.name}${p.title ? ', ' + p.title : ''} (${fmtDate(p.lastContact)})`);
  return idx;
}
const commsOf = o => (COMMS || (COMMS = commsIndex()))[o.companyId] || null;

/* ---------------- shared bits ---------------- */
const convSel = (coll, id, v) => `<span class="prio"><i style="background:${PRIO_COLOR[v] || '#999'}"></i>${selInl(`${coll}|${id}|${coll === 'opps' ? 'conviction' : 'priority'}`, [5, 4, 3, 2, 1].map(p => ({v: p, l: p + ' · ' + PRIORITY[p].replace(' conviction', '')})), v)}</span>`;
const convBadge = v => `<span class="prio" title="${esc(PRIORITY[v] || '')}"><i style="background:${PRIO_COLOR[v] || '#999'}"></i><span class="mono">${v ?? '–'}</span></span>`;
const firmOpts = types => () => all('firms').filter(f => !types || types.includes(f.type)).sort((a, b) => a.name.localeCompare(b.name)).map(f => ({v: f.id, l: f.name, g: f.type}));
const postMoney = d => (+d.preMoney || 0) + (+d.size || 0);
const impliedOwn = d => d.cheque && postMoney(d) ? Math.round(d.cheque / postMoney(d) * 1000) / 10 : null;
const thesisName = id => rec('theses', id)?.title || '';

  }

    {key:'status', label:'Status', sort: o => OPP_STATUS.indexOf(o.status), render: o => selInl(`opps|${o.id}|status`, OPP_STATUS, o.status) + (o.dealId ? `<div>${link('deal', o.dealId, '→ ' + dealName(rec('deals', o.dealId)), 'sub2')}</div>` : '') + (o.status === 'Passed' && o.passReason ? `<div class="sub2" title="${esc(o.passNote || '')}">${esc(o.passReason)}</div>` : '')},
    {key:'rms', label:'Deal team', sort: o => arr(o.rms).map(tName).join(), render: o => ownersHtml('opps', o.id, 'rms')},

  const st = Object.assign({companyId: '', leadId: '', thesisId: '', rms: [me()], conviction: 3, status: 'New', signal: 'Warm intro'}, o || {}, pre.id ? {} : pre);

      <div class="fld"><label for="of-conv">Conviction</label><select id="of-conv">${[5, 4, 3, 2, 1].map(p => `<option value="${p}" ${p === +st.conviction ? 'selected' : ''}>${p} · ${PRIORITY[p]}</option>`).join('')}</select></div>
      <div class="fld"><label for="of-status">Status</label><select id="of-status">${OPP_STATUS.filter(s => s !== 'Moved to DD' && s !== 'Passed' || s === st.status).map(s => `<option ${s === st.status ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
      <div class="fld"><span class="lbl">Deal team</span><div id="of-rm"></div></div>

    $('#of-save', el).onclick = async () => {

      st.round = g('#of-round');

    };
  }});
}

    {key:'round', label:'Round', sort: d => ROUNDS.indexOf(d.round), render: d => `${esc(d.round || '')}<div class="sub2">${esc(arr(d.sectors).join(', '))}</div>`},

    {key:'init', label:'Started', sort: d => d.initiated, render: d => `<span class="mono">${fmtDate(d.initiated)}</span>`, cls: 'nowrap'},
  ];
  return head + bar + table({id: 'deals', cols, rows: shown, defSort: {key: 'stage', dir: 'desc'}, rowCls: d => isOverdue(d.nextDue) && dealActive(d) ? 'overdue' : '', empty: 'No live deals match.'});

function dupCheck(coll, name){
  const n = String(name || '').toLowerCase().replace(/\b(ltd|limited|plc|inc|group|holdings|the|&|and|co|company)\b|[^a-z0-9 ]/g, '').trim(); if (n.length < 3) return [];
  return all(coll).filter(r => { const m = r.name.toLowerCase().replace(/[^a-z0-9 ]/g, ''); return m.includes(n) || n.includes(m) || n.split(' ').filter(w => w.length > 3).some(w => m.split(' ').includes(w)); }).slice(0, 4);
}

function dealPage(d){

function notesByOrg(){
  const m = {};
  for (const n of visibleNotes()) for (const l of arr(n.links)) {
    const keys = [l.kind + ':' + l.id];
    if (l.kind === 'person') { const p = rec('people', l.id); if (p) keys.push((p.orgType === 'company' ? 'company:' : 'firm:') + p.orgId); }
    for (const k of keys) (m[k] = m[k] || []).push(n);
  }
  return m;
}
function firmSearchFields(f, ctx){
  const port = all('holdings').filter(h => h.firmId === f.id).map(h => rec('companies', h.companyId)?.name).filter(Boolean);
  const ppl = peopleAt('firm', f.id);
  return [
    ['name', f.name], ['HQ', f.hq + ' ' + (f.city || '')], ['type', f.type], ['description', f.desc],
    ['notes', (ctx.notes['firm:' + f.id] || []).map(n => plain(n.html)).join(' ')],
    ['portfolio', port.join(' · ')], ['sectors', [...arr(f.sectors), ...arr(f.verticals)].join(', ')],
    ['geographies', [...arr(f.geos), ...arr(f.countries)].join(', ')], ['ticket', arr(f.tickets).join(' ') + ' ' + ticketText(f.tickets)],
    ['stage', arr(f.stages).join(', ')], ['capital', arr(f.capital).join(', ')], ['people', ppl.map(p => p.name + ' ' + (p.title || '')).join(' · ')],
  ];
}
function matchWhy(fields, q){
  if (!q.length) return {ok: true, why: ''};
  const hits = {};
  for (const w of q) { let any = false; for (const [k, v] of fields) if (String(v || '').toLowerCase().includes(w)) { any = true; (hits[k] = hits[k] || []).push(w); } if (!any) return {ok: false}; }
  const nameHitsAll = q.every(w => String(fields[0][1]).toLowerCase().includes(w));
  if (nameHitsAll) return {ok: true, why: ''};
  const parts = Object.keys(hits).filter(k => k !== 'name').map(k => {
    const v = String(fields.find(f => f[0] === k)[1]); const lw = v.toLowerCase(); const w = hits[k][0]; const i = lw.indexOf(w);
    const snip = k === 'notes' || k === 'description' ? '“…' + v.slice(Math.max(0, i - 25), i + w.length + 30).trim() + '…”' : (k === 'portfolio' || k === 'people') ? v.split(' · ').filter(x => x.toLowerCase().includes(w)).slice(0, 2).join(', ') : '';
    return k + (snip ? ' ' + snip : '');
  });
  return {ok: true, why: 'Matched in ' + parts.join('; ')};
}
const NODATA = '__none';
const fInND = (tab, key, list) => { const sel = arr(fget(tab, key, [])); if (!sel.length) return true; const l = arr(list); return (sel.includes(NODATA) && !l.length) || l.some(x => sel.includes(x)); };

function coStatus(c){
  const pf = portOf(c.id);
  if (pf && pf.status === 'Active') return {l: 'Portfolio', cls: 'g', sub: esc(pf.fund)};
  if (pf) return {l: pf.status === 'Exited' ? 'Portfolio' : 'Portfolio', cls: '', sub: esc(pf.status)};
  const d = all('deals').find(x => x.clientId === c.id && dealActive(x)); if (d) return {l: 'Live deal', cls: 'b', sub: esc(d.stage)};
  const o = all('opps').find(x => x.companyId === c.id && OPP_OPEN.includes(x.status)); if (o) return {l: 'Pipeline', cls: 'a', sub: esc(o.status)};
  if (arr(c.competitorOf).length) return {l: 'Competitor', cls: 'r', sub: 'to ' + esc(arr(c.competitorOf).map(id => rec('companies', id)?.name).filter(Boolean).join(', '))};
  return {l: 'Tracked', cls: '', sub: ''};
}

/* Who a note is with: its organisation and the people there */
function noteParties(links){
  const people = arr(links).filter(l => l.kind === 'person').map(l => l.id).filter(id => rec('people', id));
  let org = arr(links).find(l => l.kind === 'firm' || l.kind === 'company') || null;
  if (!org && people.length) { const p = rec('people', people[0]); org = {kind: p.orgType === 'company' ? 'company' : 'firm', id: p.orgId}; }
  return {people, org};
}
function noteWith(n, cls = 'sub2'){
  const {people, org} = noteParties(n.links);
  const ppl = people.map(id => link('person', id, nameOf('person', id), cls)).join(', ');
  const o = org && nameOf(org.kind, org.id) ? link(org.kind, org.id, nameOf(org.kind, org.id), cls) : '';
  return [ppl, o].filter(Boolean).join(' · ') || '<span class="faint">No one recorded</span>';
}
function noteForm(pre){
  const n = pre.id ? clone(rec('notes', pre.id)) : null;
  const parties = noteParties(n ? n.links : pre.links);
  const org = parties.org;
  const st = {people: parties.people, ours: n ? arr(n.attendees).length ? arr(n.attendees) : [n.author] : [me()], dealId: n ? n.dealId : pre.dealId, newP: null};

    <div class="fld"><label for="nf-type">Type</label><select id="nf-type">${NOTE_TYPES.map(t => `<option ${t === (n?.type || 'Meeting') ? 'selected' : ''}>${t}</option>`).join('')}</select></div>

    <div class="fld full">${editorHtml('nf-ed', n?.html || '')}</div>

  </div>`, foot: `<span class="left muted" style="font-size:11.5px">Ctrl+B bold · Ctrl+U underline</span><button class="btn" data-close>Cancel</button><button class="btn primary" id="nf-save">${n ? 'Save note' : 'Add note'}</button>`, onMount: el => {

      // Last contacted never moves backwards

      if (st.dealId) { const d = rec('deals', st.dealId); if (d && (!d.lastComms || d.lastComms < date)) writes.push({coll:'deals', id: d.id, rec: Object.assign(clone(d), {lastComms: date})}); }

      const ok = await act(`${n ? 'Edited' : 'Added'} ${type.toLowerCase()} note with ${whoTxt.length ? whoTxt.slice(0, 2).join(', ') + (whoTxt.length > 2 ? ' +' + (whoTxt.length - 2) : '') + (org ? ' (' + orgName_ + ')' : '') : orgName_}`, writes);

/* After a note: ask Claude for CRM field updates */
async function suggestCrmUpdates(noteId){
  if (!ST.sample) return;
  const n = rec('notes', noteId); if (!n) return;
  const np = noteParties(n.links); let person = np.people.length === 1 ? rec('people', np.people[0]) : null, org = null, orgKind = null;
  if (np.org) { orgKind = np.org.kind; org = rec(orgKind === 'firm' ? 'firms' : 'companies', np.org.id); }
  if (!org && !person) return;
  const fieldsF = {type: TYPES, sectors: SECTOR_LIST, verticals: Object.values(SECTORS).flat(), geos: GEOS, countries: COUNTRY_LIST, tickets: TICKETS, stages: STAGES_INV, capital: CAPITAL, fundSize: 'number (US$m)', desc: 'text'};
  const fieldsC = {sectors: SECTOR_LIST, verticals: Object.values(SECTORS).flat(), country: COUNTRY_LIST, stage: ROUNDS, totalRaised: 'number (US$m)', size: SIZE_BANDS, desc: 'text'};
  const fieldsP = {title: 'text', category: CATEGORY, strength: STRENGTH, phone: 'text'};
  const pick = (r, keys) => r ? Object.fromEntries(Object.keys(keys).map(k => [k, r[k] ?? null])) : null;
  const prompt = `You help keep a deal desk CRM up to date. Read the meeting note and suggest updates ONLY where the note clearly states new or different information. Never invent.

Note (${n.type}, ${n.date}): """${plain(n.html)}"""

${person ? `Person record: ${JSON.stringify(pick(person, fieldsP))}\nAllowed person fields and values: ${JSON.stringify(fieldsP)}\n` : ''}${org ? `${orgKind === 'firm' ? 'Institution' : 'Company'} record (${org.name}): ${JSON.stringify(pick(org, orgKind === 'firm' ? fieldsF : fieldsC))}\nAllowed ${orgKind} fields and values: ${JSON.stringify(orgKind === 'firm' ? fieldsF : fieldsC)}\n` : ''}
For list fields give the FULL new list (existing values plus additions). Use only the allowed values.
Reply with only a JSON array (possibly empty) of objects: {"target":"person"|"org","field":string,"value":any,"reason":string}`;
  let res;
  const t = toastLoading('✦ Claude is checking the note for CRM updates…');
  try { res = await ST.sample.json(prompt, {modelTier: 'quick'}); }
  catch (e) { t.remove(); if (e && e.code === 'not_granted') return; if (e && e.code !== 'cancelled') toast('Claude could not suggest CRM updates this time.', true); return; }
  t.remove();
  const allowed = {person: fieldsP, org: orgKind === 'firm' ? fieldsF : fieldsC};
  const sugg = arr(res).filter(s => s && allowed[s.target] && allowed[s.target][s.field] !== undefined).map(s => {
    const vocab = allowed[s.target][s.field]; let v = s.value;
    if (Array.isArray(vocab)) { if (Array.isArray(v)) v = v.filter(x => vocab.includes(x)); else if (!vocab.includes(v)) return null; }
    if (vocab === 'number (US$m)') v = +v || null;
    const r = s.target === 'person' ? person : org; if (!r || same(r[s.field], v) || (Array.isArray(v) && !v.length)) return null;
    return Object.assign(s, {value: v, from: r[s.field]});
  }).filter(Boolean);
  if (!sugg.length) { toast('✦ No CRM updates suggested from that note.'); return; }
  openModal({title: '<span class="agent-tag" style="font-size:11px">Agent</span> Suggested CRM updates', body: `<p class="muted" style="margin-top:0">Claude read your note and suggests these changes. Untick anything you don’t want.</p>${sugg.map((s, i) => `<label class="li" style="cursor:pointer"><input type="checkbox" class="sg" value="${i}" checked><div class="grow"><div><b>${esc(s.target === 'person' ? person.name : org.name)}</b> · ${esc(FIELD_NAMES[s.field] || s.field)}</div><div style="font-size:12px"><del style="color:var(--bad)">${fmtVal(s.field, s.from)}</del> → <b>${fmtVal(s.field, s.value)}</b></div><div class="why">${esc(s.reason || '')}</div></div></label>`).join('')}`,
    foot: `<button class="btn" id="sg-skip">Skip</button><button class="btn primary" id="sg-apply">Apply selected</button>`, onMount: el => {
      const off = () => {};
      $('#sg-skip', el).onclick = () => { off(); closeModal(); };
      $('#sg-apply', el).onclick = async () => {
        off(); const chosen = $$('.sg:checked', el).map(c => sugg[+c.value]); closeModal(); if (!chosen.length) return;
        const pp = person ? clone(person) : null, oo = org ? clone(org) : null;
        chosen.forEach(s => { (s.target === 'person' ? pp : oo)[s.field] = s.value; });
        const writes = [];
        if (pp && chosen.some(s => s.target === 'person')) writes.push({coll:'people', id: pp.id, rec: pp});
        if (oo && chosen.some(s => s.target === 'org')) writes.push({coll: orgKind === 'firm' ? 'firms' : 'companies', id: oo.id, rec: oo});
        await act(`Applied ${chosen.length} CRM update${chosen.length === 1 ? '' : 's'} suggested from a note`, writes, {source: 'agent'});
      };
    }});
}
function toastLoading(msg){ const el = document.createElement('div'); el.className = 'toast'; el.innerHTML = `<span class="spinner"></span> ${esc(msg)}`; $('#toasts').appendChild(el); return el; }

/* ---------------- Ask Claude (CRM search) ---------------- */
ACTIONS.askClaude = () => {
  if (!ST.sample) { toast('Ask Claude is not available in this view.', true); return; }
  let ctl = null, results = [];
  openModal({title: '<span class="agent-tag" style="font-size:11px">Agent</span> Ask Claude about the CRM', size: 'wide', body: `<div class="fld"><label for="aq">Who are you looking for?</label><textarea id="aq" placeholder="e.g. co-investors for a US$4m Series A in embedded payments in Nigeria, or likely buyers for a Kenyan digital lender"></textarea><span class="help">Claude searches only this CRM, never the web.</span></div><div style="margin:10px 0;display:flex;gap:8px"><button class="btn primary" id="aq-run">Search the CRM</button><button class="btn hidden" id="aq-stop">Stop</button></div><div id="aq-out"></div>`,
    foot: `<span class="left" id="aq-sel"></span><button class="btn" data-close>Close</button>`, onClose: () => ctl && ctl.abort(), onMount: el => {
    const out = $('#aq-out', el);
    $('#aq-stop', el).onclick = () => ctl && ctl.abort();
    $('#aq-run', el).onclick = async () => {
      const q = $('#aq', el).value.trim(); if (!q) { toast('Type a question first.', true); return; }
      ctl = new AbortController(); $('#aq-run', el).disabled = true; $('#aq-stop', el).classList.remove('hidden');
      try {
        out.innerHTML = `<p><span class="spinner"></span> Turning your question into search criteria…</p>`;
        const crit = await ST.sample.json(`Turn this request for co-investors, LPs or acquirers into search criteria for the CRM of a venture capital firm investing in fintech across Africa, the Middle East and Europe. If the request is about buyers or acquirers, set types to acquirer types such as Strategic / Corporate, Growth Equity / PE or Bank. Use ONLY these vocabularies.
sectors: ${JSON.stringify(SECTOR_LIST)}
verticals: ${JSON.stringify(Object.values(SECTORS).flat())}
geos: ${JSON.stringify(GEOS)}
countries: ${JSON.stringify(COUNTRY_LIST)}
tickets: ${JSON.stringify(TICKETS)}
stages: ${JSON.stringify(STAGES_INV)}
capital: ${JSON.stringify(CAPITAL)}
types: ${JSON.stringify(TYPES)}
Request: """${q}"""
Reply with only JSON: {"sectors":[],"verticals":[],"geos":[],"countries":[],"tickets":[],"stages":[],"capital":[],"types":[],"size_musd":number|null,"keywords":[],"summary":"one line"}`, {modelTier: 'quick', signal: ctl.signal});
        const c = Object.assign({sectors: [], verticals: [], geos: [], countries: [], tickets: [], stages: [], capital: [], types: [], keywords: []}, crit || {});
        const ctx = {notes: notesByOrg()};
        const scored = all('firms').map(f => {
          let s = 0;
          if (arr(c.types).includes(f.type)) s += 2; else if (arr(c.types).length && !INVESTOR_TYPES.includes(f.type)) s -= 3;
          s += arr(f.sectors).filter(x => arr(c.sectors).includes(x)).length * 2 + (arr(f.sectors).includes('Sector-Agnostic') ? 1 : 0);
          s += arr(f.verticals).filter(x => arr(c.verticals).includes(x)).length * 2;
          s += arr(f.geos).filter(x => arr(c.geos).includes(x)).length + arr(f.countries).filter(x => arr(c.countries).includes(x)).length;
          if (c.size_musd) s += ticketFits(f.tickets, c.size_musd) ? 2 : arr(f.tickets).length ? -1 : 0; else s += arr(f.tickets).filter(x => arr(c.tickets).includes(x)).length;
          s += arr(f.stages).filter(x => arr(c.stages).includes(x)).length * .5 + arr(f.capital).filter(x => arr(c.capital).includes(x)).length;
          const txt = (f.desc + ' ' + (ctx.notes['firm:' + f.id] || []).map(n => plain(n.html)).join(' ')).toLowerCase();
          s += arr(c.keywords).filter(k => txt.includes(String(k).toLowerCase())).length;
          if (f.ranking === 'No') s -= 2;
          return {f, s};
        }).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 80);
        if (!scored.length) { out.innerHTML = `<div class="empty">No institutions in the CRM match those criteria.</div>`; return; }
        out.innerHTML = `<div class="okbox">Criteria: ${esc(c.summary || '')} ${[...arr(c.sectors), ...arr(c.verticals), ...arr(c.geos), ...arr(c.countries), c.size_musd ? 'US$' + c.size_musd + 'm' : '', ...arr(c.types)].filter(Boolean).map(x => `<span class="chip" style="cursor:default">${esc(x)}</span>`).join(' ')}</div><p><span class="spinner"></span> Claude is rating a shortlist of ${scored.length} institutions from the CRM…</p>`;
        const profiles = scored.map(({f}) => ({id: f.id, name: f.name, type: f.type, hq: f.hq, sectors: f.sectors, verticals: f.verticals, geos: f.geos, countries: f.countries, cheque: ticketText(f.tickets) || 'unknown', stages: f.stages, lead_or_follow: f.leadFollow, deals_with_us: coInvCount(f.id), acquisition_appetite: f.acqAppetite || null, acquisition_history: arr(f.acqHistory).slice(0, 3), fund_musd: f.fundSize, ranking: f.ranking, desc: (f.desc || '').slice(0, 220), portfolio: all('holdings').filter(h => h.firmId === f.id).map(h => rec('companies', h.companyId)?.name).slice(0, 5), recent_notes: (ctx.notes['firm:' + f.id] || []).slice(0, 2).map(n => n.date + ': ' + plain(n.html).slice(0, 160))}));
        const rated = await ST.sample.json(`You are screening institutions in a deal desk CRM for this request: """${q}"""
Rate each institution Strong, Possible or Weak for fit. Base it only on the data given. Be concise.
Institutions: ${JSON.stringify(profiles)}
Reply with only a JSON array, one object per institution you rate Strong or Possible (omit clear misfits, but include at most 12 Weak ones that are borderline):
[{"id":"…","rating":"Strong"|"Possible"|"Weak","reasons":["…"],"evidence":["…"],"unknowns":["…"],"red_flags":["…"]}]`, {signal: ctl.signal});
        const order = {Strong: 0, Possible: 1, Weak: 2};
        results = arr(rated).filter(r => r && rec('firms', r.id)).sort((a, b) => (order[a.rating] ?? 3) - (order[b.rating] ?? 3));
        const li = xs => arr(xs).length ? `<ul>${arr(xs).map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
        out.innerHTML = `<div class="okbox" style="margin-bottom:10px">Criteria: ${esc(c.summary || '')}. Shortlisted ${scored.length} from the CRM; ${results.filter(r => r.rating === 'Strong').length} strong and ${results.filter(r => r.rating === 'Possible').length} possible fits.</div>` + (results.map((r, i) => { const f = rec('firms', r.id); return `<div class="ai-res"><input type="checkbox" class="aq-sel" value="${i}" aria-label="Select ${esc(f.name)}"><div><div>${link('firm', f.id, f.name)} <span class="sub2">${esc(f.type)} · ${esc(f.hq)} · ${esc(ticketText(f.tickets) || 'ticket unknown')}</span></div>${li(r.reasons)}${arr(r.evidence).length ? `<div class="lbl">Evidence</div>${li(r.evidence)}` : ''}${arr(r.unknowns).length ? `<div class="lbl">Unknowns</div>${li(r.unknowns)}` : ''}${arr(r.red_flags).length ? `<div class="lbl" style="color:var(--bad)">Red flags</div>${li(r.red_flags)}` : ''}</div><span class="pill ${r.rating === 'Strong' ? 'g' : r.rating === 'Possible' ? 'a' : ''}">${esc(r.rating)}</span></div>`; }).join('') || '<div class="empty">Claude found no good fits in the shortlist.</div>');
        $('#aq-sel', el).innerHTML = results.length ? `<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">Add ticked to <select id="aq-deal"><optgroup label="Syndicate for a live deal">${all('deals').filter(dealActive).map(d => `<option value="d:${d.id}">${esc(dealName(d))}</option>`).join('')}</optgroup><optgroup label="Buyer map for a portfolio company">${all('ports').filter(p => p.status === 'Active').map(p => `<option value="p:${p.id}">${esc(rec('companies', p.companyId)?.name)}</option>`).join('')}</optgroup></select><button class="btn primary sm" id="aq-add">Add</button></span>` : '';
        const add = $('#aq-add', el); if (add) add.onclick = async () => { const picks = $$('.aq-sel:checked', el).map(x => results[+x.value]); if (!picks.length) { toast('Tick at least one institution.', true); return; } const [k, tid] = $('#aq-deal', el).value.split(':'); if (k === 'd') addToDist(tid, picks.map(p => ({firmId: p.id, personId: peopleAt('firm', p.id)[0]?.id || null}))); else { const pf = rec('ports', tid); const have = new Set(arr(pf.exit?.buyers).map(b => b.firmId)); const add_ = picks.filter(p => !have.has(p.id)).map(p => ({firmId: p.id, fit: p.rating === 'Strong' ? 'High' : p.rating === 'Possible' ? 'Medium' : 'Low', status: 'Not approached', note: arr(p.reasons)[0] || ''})); if (!add_.length) { toast('They’re already on the buyer map.'); return; } await portW(pf, {exit: Object.assign({route: 'Not yet planned'}, pf.exit, {buyers: [...arr(pf.exit?.buyers), ...add_]})}, `Added ${add_.length} buyer${add_.length === 1 ? '' : 's'} to ${rec('companies', pf.companyId)?.name}’s buyer map`, {source: 'agent'}); } };
      } catch (e) {
        if (e && e.code === 'cancelled') out.innerHTML = '<div class="empty">Stopped.</div>';
        else if (e && e.code === 'not_granted') out.innerHTML = '<div class="banner">Claude was not allowed for this desk. Allow it when asked to use Ask Claude.</div>';
        else if (e && e.code === 'rate_limited') out.innerHTML = '<div class="banner">Too many requests just now. Try again in a minute.</div>';
        else { console.error(e); out.innerHTML = '<div class="banner">Claude could not answer this time. Try again or rephrase the question.</div>'; }
      } finally { $('#aq-run', el).disabled = false; $('#aq-stop', el).classList.add('hidden'); }
    };
  }});
};

/* Find investors / targets for an idea */
ACTIONS.ideaFind = async (arg, btn) => {
  const [iid, what] = arg.split(':'); const idea = rec('opps', iid);
  if (!ST.sample) { toast('Ask Claude is not available in this view.', true); return; }
  const box = $('#idea-ai'); btn.disabled = true;
  box.innerHTML = card(`<span class="agent-tag">Agent</span> ${what === 'investors' ? 'Suggested investors' : 'Suggested targets'}`, `<p><span class="spinner"></span> Claude is reading the CRM…</p>`);
  const sec = arr(idea.sectors);
  const pool = what === 'investors'
    ? all('firms').filter(f => INVESTOR_TYPES.includes(f.type) && !arr(idea.investors).includes(f.id) && (arr(f.sectors).some(s => sec.includes(s)) || arr(f.sectors).includes('Sector-Agnostic'))).slice(0, 60).map(f => ({id: f.id, name: f.name, type: f.type, hq: f.hq, sectors: f.sectors, geos: f.geos, ticket: ticketText(f.tickets), desc: (f.desc || '').slice(0, 160), portfolio: all('holdings').filter(h => h.firmId === f.id).map(h => rec('companies', h.companyId)?.name)}))
    : all('companies').filter(c => !arr(idea.targets).includes(c.id) && arr(c.sectors).some(s => sec.includes(s))).slice(0, 60).map(c => ({id: c.id, name: c.name, country: c.country, sectors: c.sectors, verticals: c.verticals, ownership: c.ownership, size: c.size, desc: c.desc}));
  try {
    if (!pool.length) throw {code: 'empty'};
    const res = await ST.sample.json(`Investment idea: "${idea.title}". Thesis: ${idea.thesis}. Sectors: ${sec.join(', ')}. Geography: ${arr(idea.geos).join(', ')}.
From this CRM list only, pick up to 8 ${what === 'investors' ? 'investors who could back the idea' : 'companies that could be targets'} and say why in one sentence each.
CRM: ${JSON.stringify(pool)}
Reply with only a JSON array: [{"id":"…","why":"…","fit":"Strong"|"Possible"}]`);
    const list = arr(res).filter(r => r && rec(what === 'investors' ? 'firms' : 'companies', r.id));
    box.innerHTML = card(`<span class="agent-tag">Agent</span> ${what === 'investors' ? 'Suggested investors' : 'Suggested targets'}`, list.map(r => `<div class="li"><div class="grow">${link(what === 'investors' ? 'firm' : 'company', r.id, nameOf(what === 'investors' ? 'firm' : 'company', r.id))}<div class="why">${esc(r.why)}</div></div><span class="pill ${r.fit === 'Strong' ? 'g' : 'a'}">${esc(r.fit || 'Possible')}</span><button class="btn sm" data-act="ideaAdd" data-arg="${iid}:${what}:${r.id}">Add to idea</button></div>`).join('') || '<div class="empty">No good matches in the CRM.</div>', '', list.length);
  } catch (e) {
    box.innerHTML = card(`<span class="agent-tag">Agent</span> Suggestions`, `<div class="empty">${e && e.code === 'empty' ? 'No CRM records share this idea’s sectors.' : e && e.code === 'not_granted' ? 'Claude was not allowed for this desk.' : 'Claude could not answer this time. Try again.'}</div>`);
  } finally { btn.disabled = false; }
};

    <td><div class="clamp3" style="max-width:640px" data-hc="${esc(plain(n.html))}">${sanitizeHtml(n.html)}</div></td>
    <td><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end">${n.oppId && rec('opps', n.oppId) ? `<a href="#" class="pill g" data-open="opp:${n.oppId}">In pipeline →</a>` : `<button class="btn sm" data-act="noteOpp" data-arg="${n.id}">Add to pipeline</button>`}<button class="btn sm" data-act="noteTask" data-arg="${n.id}">Add follow-up</button></div></td></tr>`;

    ${searchBox('conversations', 'Search notes…')}${fMs('conversations', 'author', 'Author', () => teamOpts())}${fMs('conversations', 'type', 'Note type', optList(NOTE_TYPES))}${fMs('conversations', 'kind', 'Record', Object.entries(kindLabel).map(([v, l]) => ({v, l})))}
    <label class="switch"><input type="checkbox" data-f="conversations|noopp" ${fget('conversations', 'noopp', false) ? 'checked' : ''}> Not yet added to the pipeline</label>

    <div class="tw"><table class="t fixed" style="min-width:1000px"><colgroup><col style="width:85px"><col style="width:150px"><col style="width:250px"><col><col style="width:150px"></colgroup><thead><tr><th class="plain">Date</th><th class="plain">Author</th><th class="plain">With</th><th class="plain">Note</th><th class="plain"></th></tr></thead><tbody>${rows || `<tr><td colspan="5"><div class="empty">No notes in this range.</div></td></tr>`}</tbody></table></div>

ACTIONS.noteOpp = id => {
  const n = rec('notes', id); const np = noteParties(n.links); const l = np.org || n.links[0];

/* Add institutions/people to a deal's list: one row per institution */

async function addToDist(dealId, pairs){
  const deal = rec('deals', dealId); if (!deal) return;
  const rows = all('dist').filter(r => r.dealId === dealId);
  const byFirm = {}; rows.forEach(r => byFirm[r.firmId] = clone(r));
  const created = {}; let added = 0, joined = 0;
  for (const {firmId, personId} of pairs) {
    if (!firmId || !rec('firms', firmId)) continue;
    const r = byFirm[firmId];
    if (r) { if (personId && r.contactId !== personId && !arr(r.extra).includes(personId)) { if (!r.contactId) r.contactId = personId; else r.extra = uniq([...arr(r.extra), personId]); r._chg = true; joined++; } }
    else { const id = uid('r'); byFirm[firmId] = {id, _new: true, dealId, firmId, contactId: personId || null, extra: [], status: 'To share', dataRoom: 'Not granted', alloc: null, lastContacted: null, feedback: '', next: '', nextDue: null, ours: arr(deal.rms).slice(0, 1).length ? [arr(deal.rms)[0]] : [me()], lastUpdate: today(), added: today()}; created[firmId] = true; added++; }
  }
  const writes = Object.values(byFirm).filter(r => r._new || r._chg).map(r => { const id = r.id; delete r._new; delete r._chg; delete r.id; return {coll:'dist', id, rec: r}; });
  if (!writes.length) { toast('They’re already on the syndicate list.'); return; }
  await act(`Added ${added} institution${added === 1 ? '' : 's'}${joined ? ` and ${joined} extra contact${joined === 1 ? '' : 's'}` : ''} to the ${dealName(deal)} syndicate`, writes);
}

const loaded = {};
function loadScript(src){ return loaded[src] = loaded[src] || new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => { delete loaded[src]; rej(new Error('Could not load ' + src)); }; document.head.appendChild(s); }); }

function propPerson(P, idKey, orgPrefix){

  const fid = P[k('FirmId')], cid = P[k('CompanyId')], pick = P[k('Pick')] || 0;

  if (cid) return peopleAt('company', cid)[pick] || null;

}
const propFrom = p => propPerson(p, 'fromId', 'from');
function crmTarget(P){

/* ============================================================
   Sourcing: theses, market map, fit scores, triage, memos, dashboard
   ============================================================ */
const PARTS = ['sector','geo','stage','traction','momentum','team'];
const PART_LABEL = {sector:'Sector fit', geo:'Geography', stage:'Stage', traction:'Traction', momentum:'Momentum', team:'Team'};
const DEF_WEIGHTS = {sector:25, geo:20, stage:20, traction:15, momentum:10, team:10};
const DISMISS_REASONS = ['Out of thesis','Out of geography','Too early','Too late or too big','Weak traction','Team concerns','Crowded market','Conflict or already covered','Duplicate','Other'];
const SIGNAL_PTS = {Funding:35, Licence:30, Partnership:20, Hiring:15, 'Product launch':15, Press:10};
const SRC_FEEDS = ['Startup registry feed','Funding round tracker','Regulator licence register','Hiring signals feed','News agent','Accelerator cohort list','Team referral'];

/* ---------- the scoring model: stored, explainable, versioned ---------- */
function inGeo(t, country){
  const reg = regionOf(country);
  if (arr(t.countries).includes(country)) return 'country';
  const g = arr(t.geos);
  if (g.includes(reg) || (g.includes('Pan-Africa') && reg.startsWith('Africa')) || (g.includes('Sub-Saharan Africa') && reg.startsWith('Africa') && reg !== 'Africa – North')) return 'region';
  return null;
}
function scoreCand(c, t, asOf){
  asOf = asOf || today();
  const parts = {}, why = [];
  if (arr(t.verticals).includes(c.vertical)) { parts.sector = 100; why.push(['+', `${c.vertical} is a core vertical for this thesis`]); }
  else if (arr(t.sectors).includes(c.sector)) { parts.sector = 60; why.push(['~', `${c.sector}, but ${c.vertical} is not a core vertical`]); }
  else { parts.sector = 10; why.push(['-', `${c.vertical} sits outside the thesis`]); }
  const g = inGeo(t, c.country);
  if (g === 'country') { parts.geo = 100; why.push(['+', `${c.country} is a focus market`]); }
  else if (g === 'region') { parts.geo = 70; why.push(['~', `${c.country} is in a target region, not a focus market`]); }
  else { parts.geo = 10; why.push(['-', `${c.country} is outside the thesis geography`]); }
  const si = ROUNDS.indexOf(c.stage), ok = arr(t.stages).map(s => ROUNDS.indexOf(s));
  if (ok.includes(si)) { parts.stage = 100; why.push(['+', `${c.stage} is a target stage`]); }
  else if (ok.some(x => Math.abs(x - si) === 1)) { parts.stage = 45; why.push(['~', `${c.stage} is one round ${ok.every(x => x > si) ? 'early' : 'late'}`]); }
  else { parts.stage = 5; why.push(['-', `${c.stage} is ${ok.length && ok.every(x => x > si) ? 'too early' : 'too late'} for this thesis`]); }
  const gr = +c.headcountGrowth || 0;
  parts.traction = Math.max(0, Math.min(100, Math.round((c.tractionIdx || 0) * .7 + Math.max(-10, Math.min(100, gr)) * .3)));
  why.push([parts.traction >= 65 ? '+' : parts.traction >= 40 ? '~' : '-', `${c.traction || 'No traction data'}${gr ? `; headcount ${gr > 0 ? '+' : ''}${gr}% in 12 months` : ''}`]);
  const recent = arr(c.signals).filter(s => s.date >= addDays(asOf, -90));
  parts.momentum = Math.min(100, recent.reduce((s, x) => s + (SIGNAL_PTS[x.type] || 10), 0));
  why.push([parts.momentum >= 50 ? '+' : parts.momentum > 0 ? '~' : '-', recent.length ? `${recent.length} signal${recent.length === 1 ? '' : 's'} in 90 days: ${uniq(recent.map(s => s.type.toLowerCase())).join(', ')}` : 'No signals in the last 90 days']);
  const fb = arr(c.founders).map(f => f.background || '');
  parts.team = Math.min(100, (fb.some(b => /exit|second-time/i.test(b)) ? 45 : 0) + (fb.some(b => /ex-(bank|mobile money|microfinance|insurer|payments)|operator/i.test(b)) ? 35 : 0) + (fb.some(b => /engineer|technical|CTO/i.test(b)) ? 20 : 0) + (fb.length >= 2 ? 10 : 0));
  why.push([parts.team >= 60 ? '+' : parts.team >= 35 ? '~' : '-', fb.length ? fb.join('; ') : 'No founder data']);
  const w = Object.assign({}, DEF_WEIGHTS, t.weights || {}); const tw = PARTS.reduce((s, k) => s + (+w[k] || 0), 0) || 1;
  const score = Math.round(PARTS.reduce((s, k) => s + parts[k] * (+w[k] || 0), 0) / tw);
  const kw = arr(t.keywords).filter(k => (c.desc + ' ' + c.traction).toLowerCase().includes(String(k).toLowerCase()));

function scoreBreakdown(c, t){
  const s = scoreOf(c, t.id); if (!s) return '<div class="empty">Not scored yet.</div>';

  <div class="bars">${PARTS.map(k => `<div class="bar" style="grid-template-columns:110px 1fr 90px"><span class="lab">${PART_LABEL[k]}</span><span class="trk"><i style="width:${s.parts[k]}%;background:${scoreColor(s.parts[k])}"></i></span><span class="v">${s.parts[k]} × ${Math.round((+w[k] || 0) / tw * 100)}%</span></div>`).join('')}</div>
  <ul style="margin:10px 0 0;padding-left:0;list-style:none">${s.why.map(x => `<li style="margin:3px 0"><b style="color:${x[0] === '+' ? 'var(--good)' : x[0] === '-' ? 'var(--bad)' : 'var(--warn)'};display:inline-block;width:16px">${x[0] === '~' ? '±' : x[0]}</b>${esc(x.slice(2))}</li>`).join('')}${s.kw && s.kw.length ? `<li><b style="color:var(--good);display:inline-block;width:16px">+</b>Thesis keywords found: ${esc(s.kw.join(', '))} (+${Math.min(6, s.kw.length * 3)})</li>` : ''}</ul>`;
}

/* ---------- agent run (simulated) and re-scoring ---------- */
ACTIONS.srcRun = async () => {
  const pool = all('cands').filter(c => c.hidden).sort((a, b) => a.id.localeCompare(b.id, undefined, {numeric: true}));
  const t0 = toastLoading('Sourcing agent is scanning its feeds (sample pool)…');
  await new Promise(r => setTimeout(r, 900)); t0.remove();
  const batch = pool.slice(0, 7);
  const vis = all('cands').filter(c => !c.hidden && c.status !== 'dismissed');
  const upd = vis.sort((a, b) => hashId(a.id + today()) % 97 - hashId(b.id + today()) % 97).slice(0, 3);
  const meta = clone(rec('meta', 'srcAgent') || {runs: []});
  if (!batch.length && !upd.length) { toast('The agent found nothing new in the sample pool.'); return; }
  const writes = [];
  const runNo = arr(meta.runs).length + 1;
  for (const c of batch) {
    const n = clone(c); n.hidden = false; n.discovered = today(); n.batch = runNo; n.sources = arr(n.sources).map(s => Object.assign(s, {date: today()}));
    for (const tid of arr(n.thesisIds)) { const t = rec('theses', tid); if (t) n.scores[tid] = scoreCand(n, t); }
    writes.push({coll:'cands', id: c.id, rec: n});
  }
  const SIG = [['Funding', c => `Raised a follow-on ${money(Math.round(c.lastRound.amount * 0.4 * 10) / 10)} extension`], ['Hiring', () => `Hiring a head of credit and two country managers`], ['Partnership', () => `Signed a distribution deal with a mobile network operator`], ['Licence', c => `Received a payment licence in ${c.country}`]];
  upd.forEach((c, k) => {
    const n = clone(c); const [type, fn] = SIG[k % SIG.length];
    n.signals = [{type, date: today(), text: fn(n)}, ...arr(n.signals)]; n.updatedAt = today();
    for (const tid of arr(n.thesisIds)) { const t = rec('theses', tid); if (t) n.scores[tid] = scoreCand(n, t); }
    writes.push({coll:'cands', id: c.id, rec: n});
  });
  meta.lastRun = Date.now(); meta.runs = [...arr(meta.runs), {at: today(), added: batch.length, updated: upd.length}].slice(-30);
  writes.push({coll:'meta', id: 'srcAgent', rec: meta});
  await act(`Sourcing agent run: ${batch.length} new compan${batch.length === 1 ? 'y' : 'ies'}, ${upd.length} updated and re-scored`, writes, {source: 'agent', toast: `Demo agent run: ${batch.length} new companies from the sample pool, ${upd.length} updated with new signals`});
};
ACTIONS.srcRescore = async tid => { const t = rec('theses', tid); const cs = all('cands').filter(c => arr(c.thesisIds).includes(tid)); await act(`Re-scored ${cs.length} companies on “${t.title}” (model v${t.version || 1})`, rescoreWrites(t, cs), {source: 'agent'}); };

ACTIONS.thesisDel = id => {
  const t = rec('theses', id); if (!t) return;

  const shared = cs.filter(c => arr(c.thesisIds).length > 1);
  const only = cs.filter(c => arr(c.thesisIds).length === 1);
  const keep = only.filter(c => c.status === 'approved');
  const drop = only.filter(c => c.status !== 'approved');
  openModal({title: 'Delete thesis', size: 'narrow', body: `<p style="margin-top:0">Delete <b>${esc(t.title)}</b>?</p><ul style="padding-left:18px;margin:6px 0">
    <li>${drop.length} compan${drop.length === 1 ? 'y' : 'ies'} found only for this thesis will be removed from the market map, along with their review history.</li>
    ${shared.length ? `<li>${shared.length} compan${shared.length === 1 ? 'y' : 'ies'} that also fit another thesis will stay there.</li>` : ''}
    ${keep.length ? `<li>${keep.length} approved compan${keep.length === 1 ? 'y stays' : 'ies stay'} in the CRM and the Pipeline.</li>` : ''}
  </ul><p class="muted" style="font-size:12px">You can bring it all back with Undo.</p>`,
    foot: `<button class="btn" data-close>Cancel</button><button class="btn danger" id="td-go">Delete thesis</button>`, onMount: el => {
      $('#td-go', el).onclick = async () => {
        const writes = [{coll:'theses', id, rec: null}];
        drop.forEach(c => writes.push({coll:'cands', id: c.id, rec: null}));
        [...shared, ...keep].forEach(c => { const n = clone(c); n.thesisIds = arr(n.thesisIds).filter(x => x !== id); if (n.scores) delete n.scores[id]; if (n.ai) delete n.ai[id]; writes.push({coll:'cands', id: c.id, rec: n}); });
        closeModal();
        const next = all('theses').find(x => x.id !== id && x.active !== false);
        await act(`Deleted thesis “${t.title}” and ${drop.length} compan${drop.length === 1 ? 'y' : 'ies'} found only for it`, writes);
        if (next) fset('sourcing', 'thesis', next.id);
      };
    }});
