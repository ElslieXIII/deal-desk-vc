ACTIONS.thesisEdit = id => thesisForm(id);
function lessonSuggestions(t){
  const d = all('cands').filter(c => c.status === 'dismissed' && (c.dismissThesis || arr(c.thesisIds)[0]) === t.id);
  const cnt = countBy(d, c => c.dismissReason); const out = [];
  const early = d.filter(c => c.dismissReason === 'Too early').map(c => c.stage);
  if ((cnt['Too early'] || 0) >= 3) { const st = Object.entries(countBy(early, x => x)).sort((a, b) => b[1] - a[1])[0]; if (st && arr(t.stages).includes(st[0])) out.push(`${cnt['Too early']} companies dismissed as too early, mostly ${st[0]}. Consider removing ${st[0]} from the target stages.`); else out.push(`${cnt['Too early']} companies dismissed as too early. Consider raising the stage weight.`); }
  if ((cnt['Too late or too big'] || 0) >= 3) out.push(`${cnt['Too late or too big']} dismissed as too late. Consider dropping the latest stage or raising the stage weight.`);
  if ((cnt['Out of geography'] || 0) >= 3) out.push(`${cnt['Out of geography']} dismissed for geography. Consider raising the geography weight from ${(t.weights || DEF_WEIGHTS).geo}.`);
  if ((cnt['Weak traction'] || 0) >= 3) out.push(`${cnt['Weak traction']} dismissed for weak traction. Consider raising the traction weight from ${(t.weights || DEF_WEIGHTS).traction}.`);
  if ((cnt['Team concerns'] || 0) >= 2) out.push(`${cnt['Team concerns']} dismissed over the team. Consider raising the team weight from ${(t.weights || DEF_WEIGHTS).team}.`);
  if ((cnt['Crowded market'] || 0) >= 2) out.push(`${cnt['Crowded market']} dismissed as crowded. Consider adding differentiating keywords to the thesis.`);
  return out;
}

  </div><p class="muted" style="font-size:12px">Saving a change to the criteria or weights creates a new model version and re-scores every company on this thesis, so scores stay comparable.</p>`,
    foot: `${t ? `<button class="btn danger left" id="tf-del">Delete thesis</button>` : ''}<button class="btn" data-close>Cancel</button><button class="btn primary" id="tf-save">${t ? 'Save and re-score' : 'Create thesis'}</button>`, onMount: el => {

      $('#tf-save', el).onclick = async () => {

/* ---------- dashboard ---------- */
function sourcingDash(t, inT){
  const reviewed = inT.filter(c => ['approved','dismissed'].includes(c.status));
  const sc = c => c.scoreAtReview ?? scoreOf(c, t.id)?.score ?? 0;
  const bands = [['80–100', 80, 101], ['60–79', 60, 80], ['40–59', 40, 60], ['Under 40', 0, 40]];
  const prec = bands.map(([l, lo, hi]) => { const r = reviewed.filter(c => sc(c) >= lo && sc(c) < hi); const a = r.filter(c => c.status === 'approved').length; return {l, n: r.length, a, p: r.length ? Math.round(a / r.length * 100) : null}; });
  const over = reviewed.filter(c => (c.status === 'approved' && sc(c) < t.threshold) || (c.status === 'dismissed' && sc(c) >= t.threshold));
  const missed = over.filter(c => c.status === 'approved'), falsePos = over.filter(c => c.status === 'dismissed');
  const promoted = inT.filter(c => c.oppId && rec('opps', c.oppId)?.dealId).length;
  const inPipe = inT.filter(c => c.oppId && rec('opps', c.oppId)).length;
  const above = inT.filter(c => (scoreOf(c, t.id)?.score || 0) >= t.threshold);
  const covC = countBy(inT, c => c.country);
  const revC = countBy(reviewed.concat(inT.filter(c => c.status === 'watch')), c => c.country);
  const agent = rec('meta', 'srcAgent') || {};
  const sugg = lessonSuggestions(t);
  const ovRow = c => `<div class="li"><div class="grow">${link('cand', c.id, c.name)} <span class="sub2">${esc(c.country)} · ${esc(c.vertical)} · ${esc(c.stage)}</span><div class="meta">${c.status === 'dismissed' ? `Dismissed: ${esc(c.dismissReason || '')}${c.dismissNote ? ' · “' + esc(c.dismissNote) + '”' : ''}` : 'Approved by ' + esc(tName(c.reviewedBy))}</div></div><span style="font-family:var(--f-display);font-size:20px;font-weight:700;color:${scoreColor(sc(c))}">${sc(c)}</span></div>`;
  return `<div class="stats">
    <div class="stat"><b>${inT.length}</b><span>In market map</span></div>
    <div class="stat"><b>${above.length}</b><span>Above threshold</span></div>
    <div class="stat"><b>${Math.round((reviewed.length + inT.filter(c => c.status === 'watch').length) / Math.max(1, inT.length) * 100)}%</b><span>Reviewed</span></div>
    <div class="stat"><b>${reviewed.length ? Math.round(reviewed.filter(c => c.status === 'approved').length / reviewed.length * 100) + '%' : '–'}</b><span>Approval rate</span></div>
    <div class="stat"><b>${inPipe}</b><span>In pipeline</span></div>
    <div class="stat"><b>${promoted}</b><span>Became live deals</span></div>
    <div class="stat"><b>${over.length}</b><span>Analyst overrides</span></div></div>
  <div class="dash">
    <div class="chart"><h4>Precision by score band</h4><p class="muted" style="margin:0 0 8px;font-size:12px">Share of reviewed companies that were approved. If the model works, higher bands should approve more often.</p><div class="bars">${prec.map(b => `<div class="bar" style="grid-template-columns:80px 1fr 110px"><span class="lab">${b.l}</span><span class="trk"><i style="width:${b.p || 0}%;background:var(--accent)"></i></span><span class="v">${b.p == null ? 'no reviews' : `${b.p}% · ${b.a}/${b.n}`}</span></div>`).join('')}</div></div>
    ${barChart('Funnel', [['Found', inT.length], ['Reviewed', reviewed.length + inT.filter(c => c.status === 'watch').length], ['Approved', inT.filter(c => c.status === 'approved').length], ['In pipeline', inPipe], ['Live deal', promoted]])}
    ${barChart('Dismiss reasons', pairsFrom(countBy(inT.filter(c => c.status === 'dismissed'), c => c.dismissReason)), 'var(--bad)')}
    ${barChart('Coverage by country (found / reviewed)', Object.keys(covC).sort((a, b) => covC[b] - covC[a]).slice(0, 10).map(k => [`${k} (${revC[k] || 0} reviewed)`, covC[k]]))}
    ${barChart('Coverage by sub-sector', pairsFrom(countBy(inT, c => c.vertical)))}
    ${trendChart('Companies found per agent run', arr(agent.runs).slice(-8).map(r => [fmtDate(r.at), r.added]))}
  </div>
  <div class="rec-grid" style="margin-top:12px">
    ${card('Model missed: approved below threshold', missed.map(ovRow).join('') || '<div class="empty">No approvals below the threshold.</div>', '', missed.length)}
    ${card('False positives: dismissed above threshold', falsePos.map(ovRow).join('') || '<div class="empty">No dismissals above the threshold.</div>', '', falsePos.length)}
  </div>
  ${card('What the reviews suggest', sugg.length ? `<ul style="margin:6px 0;padding-left:18px">${sugg.map(x => `<li style="margin:3px 0">${esc(x)}</li>`).join('')}</ul><button class="btn sm" data-act="thesisEdit" data-arg="${t.id}">Adjust the thesis</button>` : '<div class="empty">Not enough dismissals yet to suggest changes.</div>')}`;
}

const moic = p => p.cost ? Math.round(((p.status === 'Exited' ? (+p.exitProceeds || 0) : (+p.valuation || 0)) / p.cost) * 100) / 100 : null;
const latestKpi = p => arr(p.kpis).slice().sort((a, b) => b.q.localeCompare(a.q))[0] || null;
const prevKpi = p => arr(p.kpis).slice().sort((a, b) => b.q.localeCompare(a.q))[1] || null;

function prevQ(q, n = 1){ let [y, k] = q.split('-Q').map(Number); for (let i = 0; i < n; i++) { k--; if (!k) { k = 4; y--; } } return y + '-Q' + k; }

function reportStatus(p, q){
  const r = arr(p.reports).find(x => x.q === q); if (!r) return {s: 'none'};
  if (r.received) return {s: 'received', r};
  if (r.due && r.due < today()) return {s: 'overdue', r};
  return {s: 'due', r};
}
function sparkline(vals, w = 90, h = 26){
  const v = vals.filter(x => x != null); if (v.length < 2) return '';
  const min = Math.min(...v), max = Math.max(...v), rng = max - min || 1;
  const pts = vals.map((x, i) => x == null ? null : [i / (vals.length - 1) * (w - 4) + 2, h - 3 - ((x - min) / rng) * (h - 6)]).filter(Boolean);
  const up = v[v.length - 1] >= v[0];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="${up ? 'var(--good)' : 'var(--bad)'}" stroke-width="1.6" points="${pts.map(p => p.map(n => n.toFixed(1)).join(',')).join(' ')}"/><circle cx="${pts[pts.length - 1][0]}" cy="${pts[pts.length - 1][1]}" r="2.4" fill="${up ? 'var(--good)' : 'var(--bad)'}"/></svg>`;
}

/* ---------- actions on a portfolio record ---------- */
const portW = (p, patch, label, opts) => act(label, [{coll:'ports', id: p.id, rec: Object.assign(clone(p), patch)}], opts);
ACTIONS.repRecv = arg => { const [pid, q] = arg.split(':'); const p = rec('ports', pid); const reports = arr(p.reports).map(r => r.q === q ? Object.assign({}, r, {received: today()}) : r); portW(p, {reports}, `Marked ${qLabel(q)} report received from ${rec('companies', p.companyId)?.name}`); };
ACTIONS.repChase = arg => { const [pid, q] = arg.split(':'); const p = rec('ports', pid); const c = rec('companies', p.companyId); taskForm({title: `Chase ${qLabel(q)} report from ${c.name}`, link: {kind: 'company', id: c.id}, category: 'Portfolio', owners: [p.board || me()], due: addDays(today(), 2), source: 'Task'}); };
ACTIONS.exitSet = (v, el) => { const p = rec('ports', el.dataset.port); const exit = Object.assign({buyers: []}, p.exit || {}, {[el.dataset.field]: v || null}); portW(p, {exit}, `Set exit ${el.dataset.field === 'route' ? 'route' : 'horizon'} for ${rec('companies', p.companyId)?.name}: ${v || 'not set'}`); };
ACTIONS.buyerSet = (v, el) => { const p = rec('ports', el.dataset.port); const buyers = arr(p.exit?.buyers).map(b => b.firmId === el.dataset.firm ? Object.assign({}, b, {[el.dataset.field]: v}) : b); portW(p, {exit: Object.assign({}, p.exit, {buyers})}, `Updated ${rec('firms', el.dataset.firm)?.name} on ${rec('companies', p.companyId)?.name}’s buyer map`); };
ACTIONS.buyerRm = arg => { const [pid, fid] = arg.split(':'); const p = rec('ports', pid); portW(p, {exit: Object.assign({}, p.exit, {buyers: arr(p.exit?.buyers).filter(b => b.firmId !== fid)})}, `Removed ${rec('firms', fid)?.name} from ${rec('companies', p.companyId)?.name}’s buyer map`); };
ACTIONS.buyerSuggest = pid => {
  const p = rec('ports', pid); const c = rec('companies', p.companyId); const have = new Set(arr(p.exit?.buyers).map(b => b.firmId));
  const sug = all('firms').filter(f => BUYER_TYPES.includes(f.type) && !have.has(f.id)).map(f => ({f, s: (arr(f.sectors).some(s => arr(c.sectors).includes(s)) ? 2 : 0) + (arr(f.verticals).some(v => arr(c.verticals).includes(v)) ? 2 : 0) + (f.acqAppetite === 'High' ? 2 : f.acqAppetite === 'Medium' ? 1 : 0) + (arr(f.countries).includes(c.country) || arr(f.geos).includes(regionOf(c.country)) ? 1 : 0)})).filter(x => x.s >= 3).sort((a, b) => b.s - a.s).slice(0, 5);
  if (!sug.length) { toast('No further likely buyers in the CRM. Add institutions with acquisition appetite first.'); return; }

  portW(p, {exit: Object.assign({route: 'Not yet planned'}, p.exit, {buyers})}, `Added ${sug.length} suggested buyer${sug.length === 1 ? '' : 's'} for ${c.name}`);
};

function portfolioCards(c){

  const m = moic(p);
  const buyers = arr(p.exit?.buyers);
  return `${card('Portfolio position', kv([['Fund', `${esc(p.fund)} · ${esc(p.round || '')} · invested ${fmtDate(p.invested)}`], ['Cost', money(p.cost)], ['Ownership', p.ownership ? p.ownership + '%' : ''], ['Current value', `${money(p.status === 'Exited' ? p.exitProceeds : p.valuation)} <span class="sub2">marked ${fmtDate(p.markDate)}</span>`], ['Multiple on cost', m != null ? `<b style="color:${m >= 2 ? 'var(--good)' : m < 1 ? 'var(--bad)' : 'inherit'}">${m.toFixed(2)}x</b>` : ''], ['Reserves', money(p.reserves)], ['Health', selInl(`ports|${p.id}|health`, HEALTH, p.health)], ['Board', p.board ? `${esc(tName(p.board))} (${esc((p.boardRole || 'Seat').toLowerCase())})` : 'No board role'], ['Status', esc(p.status)]]))}
  ${card('Key figures', ks.length ? `<div class="tw" style="border:0"><table class="t"><thead><tr><th class="plain">Quarter</th><th class="plain">${esc(p.kpiLabel || 'Key figure')}</th><th class="plain">Burn / month</th><th class="plain">Runway</th><th class="plain">Headcount</th><th class="plain">Customers</th></tr></thead><tbody>${ks.slice().reverse().map(k => `<tr><td class="mono">${qLabel(k.q)}</td><td class="mono">${fmtNum(k.main, 'm')}</td><td class="mono">${fmtNum(k.burn, 'm')}</td><td class="mono" style="color:${k.runway < 9 ? 'var(--bad)' : 'inherit'}">${k.runway ?? '—'}${k.runway != null ? ' mo' : ''}</td><td class="mono">${fmtNum(k.headcount)}</td><td class="mono">${fmtNum(k.customers)}</td></tr>`).join('')}</tbody></table></div>${ks.length > 1 ? trendChart(p.kpiLabel || 'Key figure', ks.map(k => [qLabel(k.q).replace('20', ''), Math.round(k.main * 10) / 10])) : ''}` : '<div class="empty">No figures recorded yet.</div>', `<button class="btn sm" data-act="kpiAdd" data-arg="${p.id}">+ Quarter</button>`)}
  ${card('Reporting and board', `<div class="li"><div class="grow"><b>Next board meeting</b><div class="meta">${p.board ? esc(tName(p.board)) + ' attends' : 'No board role'}</div></div>${dateInl(`ports|${p.id}|nextBoard`, p.nextBoard)}</div>${arr(p.reports).slice().sort((a, b) => b.q.localeCompare(a.q)).slice(0, 4).map(r => `<div class="li"><div class="grow">${qLabel(r.q)} founder update</div>${repCell(p, r.q)}</div>`).join('')}`)}
  ${card('Founder asks', arr(p.asks).slice().sort((a, b) => (a.status === 'Done') - (b.status === 'Done')).map(a => `<div class="li"><input type="checkbox" ${a.status === 'Done' ? 'checked' : ''} data-act="askDone" data-arg="${p.id}:${a.id}" aria-label="Done"><div class="grow"><div class="ttl" style="${a.status === 'Done' ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(a.text)}</div><div class="meta">${esc(tName(a.owner))} · asked ${fmtDate(a.date)}${a.due ? ' · due ' + fmtDate(a.due) : ''}</div></div></div>`).join('') || '<div class="empty">No asks recorded.</div>', `<button class="btn sm" data-act="askAdd" data-arg="${p.id}">+ Ask</button>`, arr(p.asks).filter(a => a.status === 'Open').length)}
  ${card('Exit planning', `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0 8px"><label class="sub2">Route <select class="inl" data-chg="exitSet" data-port="${p.id}" data-field="route">${EXIT_ROUTES.map(r => `<option ${r === (p.exit?.route || 'Not yet planned') ? 'selected' : ''}>${r}</option>`).join('')}</select></label><label class="sub2">Horizon <select class="inl" data-chg="exitSet" data-port="${p.id}" data-field="horizon"><option value="">Not set</option>${[0, 1, 2, 3, 4, 5].map(k => new Date().getFullYear() + k).map(y => `<option ${String(y) === String(p.exit?.horizon || '') ? 'selected' : ''}>${y}</option>`).join('')}</select></label></div>
    ${buyers.length ? `<table class="t"><thead><tr><th class="plain">Possible buyer</th><th class="plain">Fit</th><th class="plain">Status</th><th class="plain"></th></tr></thead><tbody>${buyers.map(b => { const f = rec('firms', b.firmId); return `<tr><td>${link('firm', b.firmId, f?.name)}<div class="sub2">${esc(f?.type || '')}${f?.acqAppetite ? ' · ' + esc(f.acqAppetite.toLowerCase()) + ' appetite' : ''}</div>${b.note ? `<div class="sub2">${esc(b.note)}</div>` : ''}</td><td><select class="inl" data-chg="buyerSet" data-port="${p.id}" data-firm="${b.firmId}" data-field="fit">${LEVELS.map(x => `<option ${x === b.fit ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><select class="inl" data-chg="buyerSet" data-port="${p.id}" data-firm="${b.firmId}" data-field="status">${BUYER_STATUS.map(x => `<option ${x === b.status ? 'selected' : ''}>${x}</option>`).join('')}</select></td><td><button class="btn sm ghost" data-act="buyerRm" data-arg="${p.id}:${b.firmId}" aria-label="Remove">✕</button></td></tr>`; }).join('')}</tbody></table>` : '<div class="empty">No buyers mapped yet.</div>'}`,
    `<span>${msButton('buy-' + p.id, {label: '+ Add buyer', options: () => all('firms').filter(f => BUYER_TYPES.includes(f.type) && !buyers.some(b => b.firmId === f.id)).map(f => ({v: f.id, l: f.name, g: f.type})), get: () => [], set: v => { const fid = arr(v)[0]; if (fid) { closePop(); portW(p, {exit: Object.assign({route: 'Not yet planned'}, p.exit, {buyers: [...buyers, {firmId: fid, fit: 'Medium', status: 'Not approached', note: ''}]})}, `Added ${rec('firms', fid).name} to ${c.name}’s buyer map`); } }, onChange: () => {}})} <button class="btn sm" data-act="buyerSuggest" data-arg="${p.id}">Suggest from CRM</button></span>`, buyers.length)}`;
}

</script>
</body>
</html>
